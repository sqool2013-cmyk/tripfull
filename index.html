        const { useState, useMemo, useEffect, useCallback } = React;

        const APP_VERSION = 'v.0.2.2';
        const U = window.TripfullUtils;
        const B = window.TripfullBudget;

// ... existing code ... -->
            const [isPlaceModalOpen, setIsPlaceModalOpen] = useState(false);

            }, []);
// ... existing code ... -->
            const localTimeInfo = useMemo(() => U.getLocalTimeInfo(currentTrip, nowTick), [currentTrip, nowTick, presetsVersion]);
            const tripStatusBadge = useMemo(() => U.getTripStatusBadge ? U.getTripStatusBadge(currentTrip) : null, [currentTrip, nowTick]);

            const linkedExpensesByPlaceId = useMemo(() => {

                expenses.forEach(exp => {
                    if (!exp || !exp.linkedPlaceId) return;
                    if (!map[exp.linkedPlaceId]) {
                        map[exp.linkedPlaceId] = { count: 0, totalKRW: 0 };
                    }
                    map[exp.linkedPlaceId].count += 1;
                    map[exp.linkedPlaceId].totalKRW += B.toKRW(currentTrip, exp.amount, exp.currency, exp.day || 0);
                });
                return map;
            }, [expenses, currentTrip, presetsVersion]);

            const filteredExpenses = useMemo(() => {
// ... existing code ... -->
            const openAddPlaceModal = () => {
                setEditingPlaceInfo(null);
                setAddressSearchResults([]);
                setNewPlace({
                    day: selectedDay, time: '', endTime: '', place: '', address: '',
                    category: 'sightseeing', memo: '', cost: '', currency: currentTrip?.currency || 'KRW', linkUrl: ''
                });
                setIsPlaceModalOpen(true);
            };

            const openEditPlaceModal = (dayNum, item) => {
                setEditingPlaceInfo({ day: Number(dayNum), id: item.id });
                setAddressSearchResults([]);
                setNewPlace({
                    day: Number(dayNum),
                    time: item.time || '',
                    endTime: item.endTime || '',
                    place: item.place,
                    address: item.address || '',
                    category: item.category || 'sightseeing',
                    memo: item.memo || '',
                    cost: item.cost ? String(item.cost) : '',
                    currency: item.currency || currentTrip?.currency || 'KRW',
                    linkUrl: item.linkUrl || ''
                });
                setIsPlaceModalOpen(true);
            };

            const handleSavePlace = (e) => {
                e.preventDefault();
                if (!newPlace.place.trim() || !currentTrip) return;
                if (newPlace.time && newPlace.endTime && newPlace.endTime < newPlace.time) {
                    return showToast('⚠️ 종료 시각이 방문 시각보다 빠릅니다.');
                }
                const targetDay = Number(newPlace.day) || selectedDay;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const itemData = {
                    id: editingPlaceInfo ? editingPlaceInfo.id : 'i_' + Date.now(),
                    time: newPlace.time,
                    endTime: newPlace.endTime || '',
                    place: newPlace.place.trim(),
                    address: newPlace.address.trim(),
                    category: newPlace.category,
                    memo: newPlace.memo.trim(),
                    cost: Number(newPlace.cost) || 0,
                    currency: newPlace.currency || currentTrip.currency,
                    linkUrl: U.normalizeExternalUrl ? U.normalizeExternalUrl(newPlace.linkUrl) : (newPlace.linkUrl || '').trim(),
                    updatedBy: authorTag
                };
// ... existing code ... -->
                const [moved] = list.splice(index, 1);
                list.splice(targetIndex, 0, moved);
                updateCurrentTrip(t => ({ ...t, itinerary: { ...t.itinerary, [dayNum]: list } }));
            };

            // [v0.2.2] 현재 일차 일정 시간순 자동 정렬
            const handleSortDayItinerary = (dayNum) => {
                if (!currentTrip) return;
                const list = toArray(currentTrip.itinerary?.[dayNum]);
                if (list.length <= 1) return;
                const sorted = U.sortItineraryItems(list);
                updateCurrentTrip(t => ({ ...t, itinerary: { ...t.itinerary, [dayNum]: sorted } }));
                showToast(`⏰ ${dayNum}일차 일정을 시간순으로 정렬했습니다.`);
            };

            // [v0.2.2] 항공편(편도/왕복) 자동 일정 배치 (+ 선택 시 가계부 동시 등록)
            const handleSaveFlight = (flightForm) => {
                if (!currentTrip) return;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const nowId = Date.now();
                const outDay = Number(flightForm.outDay) || 1;
                const inDay = Number(flightForm.inDay) || outDay;
                const cleanUrl = U.normalizeExternalUrl ? U.normalizeExternalUrl(flightForm.linkUrl) : '';
                const rawCost = Number(flightForm.cost) || 0;
                const curr = flightForm.currency || 'KRW';

                const outPlaceText = flightForm.outTitle.trim();
                const outItem = {
                    id: 'i_flt_out_' + nowId,
                    time: flightForm.outTime || '',
                    endTime: flightForm.outEndTime || '',
                    place: outPlaceText.startsWith('🛫') || outPlaceText.startsWith('✈️') ? outPlaceText : `🛫 ${outPlaceText}`,
                    address: '',
                    category: 'transport',
                    memo: (flightForm.outMemo || '').trim(),
                    cost: rawCost,
                    currency: curr,
                    linkUrl: cleanUrl,
                    updatedBy: authorTag
                };

                let inItem = null;
                if (flightForm.tripType === 'round') {
                    const inPlaceText = flightForm.inTitle.trim();
                    inItem = {
                        id: 'i_flt_in_' + (nowId + 1),
                        time: flightForm.inTime || '',
                        endTime: flightForm.inEndTime || '',
                        place: inPlaceText.startsWith('🛬') || inPlaceText.startsWith('✈️') ? inPlaceText : `🛬 ${inPlaceText}`,
                        address: '',
                        category: 'transport',
                        memo: (flightForm.inMemo || '').trim(),
                        cost: 0,
                        currency: curr,
                        linkUrl: cleanUrl,
                        updatedBy: authorTag
                    };
                }

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    const outList = [...toArray(nextItin[outDay]), outItem];
                    nextItin[outDay] = outItem.time ? U.sortItineraryItems(outList) : outList;

                    if (inItem) {
                        const inList = [...toArray(nextItin[inDay]), inItem];
                        nextItin[inDay] = inItem.time ? U.sortItineraryItems(inList) : inList;
                    }

                    let nextExpenses = toArray(t.expenses);
                    if (rawCost > 0 && flightForm.addToBudget) {
                        const fltExp = {
                            id: 'e_flt_' + nowId,
                            day: 0,
                            title: flightForm.tripType === 'round' ? `항공권(왕복) · ${outPlaceText}` : `항공권 · ${outPlaceText}`,
                            amount: rawCost,
                            currency: curr,
                            payerId: flightForm.payerId || companions[0]?.id || 'c1',
                            splitWith: companions.map(c => c.id),
                            category: 'transport',
                            method: 'card',
                            linkedPlaceId: outItem.id,
                            linkedPlaceName: outItem.place,
                            updatedBy: authorTag
                        };
                        nextExpenses = [fltExp, ...nextExpenses];
                    }

                    return { ...t, itinerary: nextItin, expenses: nextExpenses };
                });

                setSelectedDay(outDay);
                showToast(
                    flightForm.tripType === 'round'
                        ? `✈️ 왕복 항공편이 ${outDay}일차·${inDay}일차에 자동 배치되었습니다!`
                        : `✈️ 편도 항공편이 ${outDay}일차에 자동 배치되었습니다!`
                );
            };

            // [v0.2.2] 숙소(전체/일부 기간) 자동 일정 배치 (+ 선택 시 가계부 동시 등록)
            const handleSaveHotel = (hotelForm) => {
                if (!currentTrip) return;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const nowId = Date.now();
                const inDay = Number(hotelForm.checkInDay) || 1;
                const outDay = Math.max(inDay, Number(hotelForm.checkOutDay) || inDay);
                const cleanName = hotelForm.name.trim();
                const cleanAddr = (hotelForm.address || '').trim();
                const cleanMemo = (hotelForm.memo || '').trim();
                const cleanUrl = U.normalizeExternalUrl ? U.normalizeExternalUrl(hotelForm.linkUrl) : '';
                const rawCost = Number(hotelForm.cost) || 0;
                const curr = hotelForm.currency || currentTrip.currency || 'KRW';

                const checkInItem = {
                    id: 'i_htl_in_' + nowId,
                    time: hotelForm.checkInTime || '15:00',
                    endTime: '',
                    place: `${cleanName} 체크인`,
                    address: cleanAddr,
                    category: 'hotel',
                    memo: cleanMemo,
                    cost: rawCost,
                    currency: curr,
                    linkUrl: cleanUrl,
                    updatedBy: authorTag
                };

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    const inList = [...toArray(nextItin[inDay]), checkInItem];
                    nextItin[inDay] = checkInItem.time ? U.sortItineraryItems(inList) : inList;

                    if (outDay > inDay) {
                        if (hotelForm.includeMiddleNights) {
                            for (let d = inDay + 1; d < outDay; d++) {
                                const midItem = {
                                    id: `i_htl_mid_${nowId}_${d}`,
                                    time: '',
                                    endTime: '',
                                    place: `${cleanName} (연박)`,
                                    address: cleanAddr,
                                    category: 'hotel',
                                    memo: cleanMemo,
                                    cost: 0,
                                    currency: curr,
                                    linkUrl: cleanUrl,
                                    updatedBy: authorTag
                                };
                                nextItin[d] = [...toArray(nextItin[d]), midItem];
                            }
                        }

                        const checkOutItem = {
                            id: 'i_htl_out_' + (nowId + 99),
                            time: hotelForm.checkOutTime || '11:00',
                            endTime: '',
                            place: `${cleanName} 체크아웃`,
                            address: cleanAddr,
                            category: 'hotel',
                            memo: cleanMemo,
                            cost: 0,
                            currency: curr,
                            linkUrl: cleanUrl,
                            updatedBy: authorTag
                        };
                        const outList = [...toArray(nextItin[outDay]), checkOutItem];
                        nextItin[outDay] = checkOutItem.time ? U.sortItineraryItems(outList) : outList;
                    }

                    let nextExpenses = toArray(t.expenses);
                    if (rawCost > 0 && hotelForm.addToBudget) {
                        const htlExp = {
                            id: 'e_htl_' + nowId,
                            day: Number(hotelForm.budgetDay) || 0,
                            title: `${cleanName} 숙박비`,
                            amount: rawCost,
                            currency: curr,
                            payerId: hotelForm.payerId || companions[0]?.id || 'c1',
                            splitWith: companions.map(c => c.id),
                            category: 'hotel',
                            method: 'card',
                            linkedPlaceId: checkInItem.id,
                            linkedPlaceName: checkInItem.place,
                            updatedBy: authorTag
                        };
                        nextExpenses = [htlExp, ...nextExpenses];
                    }

                    return { ...t, itinerary: nextItin, expenses: nextExpenses };

                setSelectedDay(inDay);
                showToast(`🏨 '${cleanName}' 숙소 일정(${inDay}일차~${outDay}일차)이 자동 배치되었습니다!`);
            };

            // 7. 가계부 지출 · 영수증 지연 로딩 · 다회차 중간 정산 핸들러
            // ================================================================
            const openAddExpenseModal = (defaultDay = null, preset = null) => {

                    splitWith: companions.map(c => c.id),
                    category: p.category || 'food',
                    method: 'card',
                    linkedPlaceId: p.linkedPlaceId || '',
                    linkedPlaceName: p.linkedPlaceName || '',

                    pendingReceipt: null,

                                                        <span className="text-xs font-extrabold text-slate-400">총 지출 금액 (원화 환산 · 중간 정산 무관 보존)</span>
                                                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-0.5">
                                                            {budgetSummary.totalSpentKRW.toLocaleString()}<span className="text-sm font-bold text-slate-500 ml-1">원</span>
                                                        </div>
                                                        {budgetSummary.totalSettledKRW > 0 && (
                                                            <div className="inline-flex items-center gap-1 mt-1.5 text-[11px] font-extrabold text-sky-700 bg-sky-50 border border-sky-200 px-2.5 py-0.5 rounded-full">
                                                                <span>✅ 중간 정산 완료 {budgetSummary.totalSettledKRW.toLocaleString()}원 ({budgetSummary.settlements.length}건)</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-1.5 flex-wrap shrink-0">
                                                        <button onClick={() => setIsQuickCalcModalOpen(true)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-extrabold" title="빠른 환율 계산기">
                                                            🧮 계산기
                                                        </button>
                                                        <button
                                                            onClick={() => {
                                                                const ok = U.exportExpensesToCSV(currentTrip, budgetSummary);
                                                                showToast(ok ? '📥 가계부 CSV(엑셀) 파일이 다운로드되었습니다.' : '❌ 파일 생성에 실패했습니다.');
                                                            }}
                                                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-extrabold"
                                                            title="엑셀에서 열 수 있는 CSV 파일로 내보냅니다"
                                                        >
                                                            📥 CSV
                                                        </button>
                                                        <button onClick={() => setIsRateModalOpen(true)} className="bg-emerald-50 hover:bg-emerald-100 text-[#00A878] border border-emerald-200 px-2.5 py-1.5 rounded-xl text-xs font-extrabold">
                                                            💱 환율 설정
                                                        </button>
                                                    </div>
                                                </div>
// ... existing code ... -->
                                                                    <div onClick={() => openEditExpenseModal(exp)} className="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                                                                        <div className={`w-10 h-10 rounded-2xl flex items-center justify-center border text-base shrink-0 ${meta.color}`}>{meta.emoji}</div>
                                                                        <div className="min-w-0">
                                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                                <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-md ${Number(exp.day) === 0 ? 'bg-sky-50 text-sky-700' : 'bg-slate-100 text-slate-600'}`}>
                                                                                    {Number(exp.day) === 0 ? '사전 지출' : `${exp.day}일차`}
                                                                                </span>
                                                                                {exp.linkedPlaceName && (
                                                                                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-[#00A878] border border-emerald-200 truncate max-w-[180px]">
                                                                                        📍 {exp.linkedPlaceName}
                                                                                    </span>
                                                                                )}
                                                                                <h4 className="text-sm sm:text-base font-extrabold text-slate-800">{exp.title}</h4>
                                                                            </div>
                                                                            <div className="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5 flex-wrap">
                                                                                <span>결제: <b>{payer ? `${payer.avatar} ${payer.name}` : '미지정'}</b> · 정산 {toArray(exp.splitWith).length}명 · {exp.method === 'cash' ? '💵 현금' : '💳 카드'}</span>
                                                                                {(exp.hasReceipt || exp.receiptUrl) && (
                                                                                    <button
                                                                                        type="button"
                                                                                        onClick={(e) => {
                                                                                            e.stopPropagation();
                                                                                            openReceiptViewer(exp);
                                                                                        }}
                                                                                        className="text-[11px] font-extrabold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-200/60"
                                                                                    >
                                                                                        🧾 영수증 보기
                                                                                    </button>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </div>
// ... existing code ... -->
                                        <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-5">
                                            <div className="flex flex-wrap items-center justify-between gap-2">
                                                <div>
                                                    <h3 className="text-lg font-extrabold text-slate-800">멤버별 준비물 체크리스트</h3>
                                                    <p className="text-xs text-slate-400">항목 이름을 터치하면 바로 수정할 수 있으며, 우측 ∧ ∨ 버튼으로 순서를 조정합니다.</p>
                                                </div>
                                                <span className="text-xs font-extrabold text-[#00A878] bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
                                                    전원 완료 {fullyCompletedCheckCount} / {checklist.length}
                                                </span>
                                            </div>
// ... existing code ... -->
                                                <div className="border border-slate-200 rounded-2xl overflow-hidden bg-white">
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full border-collapse text-left min-w-max">
                                                            <thead>
                                                                <tr className="bg-slate-50 border-b border-slate-200">
                                                                    <th className="sticky left-0 z-10 bg-slate-50 py-3 px-3 sm:px-4 text-xs sm:text-sm font-extrabold text-slate-700 min-w-[125px] sm:min-w-[180px] border-r">준비물</th>
                                                                    {companions.map(comp => (
                                                                        <th key={comp.id} className="py-2.5 px-2 sm:px-3 text-center min-w-[68px] sm:min-w-[88px] border-r">
                                                                            <div className="text-xs sm:text-sm font-extrabold text-slate-800 whitespace-nowrap">{comp.avatar} {comp.name}</div>
                                                                        </th>
                                                                    ))}
                                                                    <th className="py-3 px-2 text-center text-xs font-bold text-slate-400 w-24">순서·삭제</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-200">
                                                                {checklist.map((item, idx) => (
                                                                    <tr key={item.id} className="hover:bg-slate-50/60">
                                                                        <td
                                                                            onClick={() => setEditingCheckItem({ id: item.id, text: item.text })}
                                                                            className="sticky left-0 z-10 py-3 px-3 sm:px-4 bg-white border-r cursor-pointer hover:text-[#00A878]"
                                                                            title="클릭하여 항목 이름 수정"
                                                                        >
                                                                            <span className="text-xs sm:text-sm font-extrabold text-slate-800 hover:underline">{item.text}</span>
                                                                        </td>
                                                                        {companions.map(comp => {
                                                                            const checked = isItemCheckedByCompanion(item, comp.id);
                                                                            return (
                                                                                <td
                                                                                    key={comp.id}
                                                                                    onClick={() => {
                                                                                        updateCurrentTrip(t => ({
                                                                                            ...t,
                                                                                            checklist: toArray(t.checklist).map(c => {
                                                                                                if (c.id !== item.id) return c;
                                                                                                const prevMap = (c.checkedBy && typeof c.checkedBy === 'object') ? { ...c.checkedBy } : {};
                                                                                                prevMap[comp.id] = !checked;
                                                                                                return { ...c, checkedBy: prevMap };
                                                                                            })
                                                                                        }));
                                                                                    }}
                                                                                    className="py-2.5 px-2 sm:px-3 text-center border-r cursor-pointer select-none"
                                                                                >
                                                                                    <button type="button" className={`w-7 h-7 mx-auto rounded-xl flex items-center justify-center text-xs font-black border transition ${checked ? 'bg-[#00C48C] border-[#00C48C] text-white' : 'bg-slate-50 border-slate-200 text-transparent'}`}>✓</button>
                                                                                </td>
                                                                            );
                                                                        })}
                                                                        <td className="py-2.5 px-2 text-center whitespace-nowrap">
                                                                            <div className="inline-flex items-center gap-1">
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => moveChecklistOrder(idx, 'up')}
                                                                                    disabled={idx === 0}
                                                                                    className="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-black text-slate-600 disabled:opacity-25"
                                                                                    title="위로 이동"
                                                                                >
                                                                                    ∧
                                                                                </button>
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => moveChecklistOrder(idx, 'down')}
                                                                                    disabled={idx === checklist.length - 1}
                                                                                    className="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-black text-slate-600 disabled:opacity-25"
                                                                                    title="아래로 이동"
                                                                                >
                                                                                    ∨
                                                                                </button>
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => {
                                                                                        askConfirm({
                                                                                            title: '준비물 삭제',
                                                                                            message: `[${item.text}] 항목을 삭제하시겠습니까?`,
                                                                                            onConfirm: () => {
                                                                                                updateCurrentTrip(t => ({ ...t, checklist: toArray(t.checklist).filter(c => c.id !== item.id) }));
                                                                                            }
                                                                                        });
                                                                                    }}
                                                                                    className="w-6 h-6 rounded-lg text-xs font-black text-rose-500 hover:bg-rose-50"
                                                                                    title="항목 삭제"
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>
                        </>
                    )}
// ... existing code ... -->
                    <M.ExpenseModal
                        isOpen={isExpenseModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        companions={companions}
                        editingExpenseId={editingExpenseId}
                        newExpense={newExpense}
                        setNewExpense={setNewExpense}
                        isSavingExpense={isSavingExpense}
                        onPreviewExistingReceipt={(expId) => openReceiptViewer(expId)}
                        onClose={() => setIsExpenseModalOpen(false)}
                        onSubmit={handleSaveExpense}
                    />

                    <M.FlightHotelModal
                        isOpen={isFlightHotelModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        companions={companions}
                        onClose={() => setIsFlightHotelModalOpen(false)}
                        onSaveFlight={handleSaveFlight}
                        onSaveHotel={handleSaveHotel}
                    />

                    <M.ReceiptViewerModal
                        viewerState={receiptViewer}
                        onClose={() => setReceiptViewer(prev => ({ ...prev, isOpen: false }))}
                    />

                    <M.QuickCalcModal
                        isOpen={isQuickCalcModalOpen}
                        currentTrip={currentTrip}
                        selectedDay={selectedDay}
                        onClose={() => setIsQuickCalcModalOpen(false)}
                        onApplyToExpense={({ amount, currency }) => openAddExpenseModal(null, { amount, currency })}
                    />

                    <M.NewTripModal
                        isOpen={isNewTripModalOpen}
                        form={newTripForm}
                        setForm={setNewTripForm}
                        registeredProfiles={registeredProfiles}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsNewTripModalOpen(false)}
                        onSubmit={handleCreateNewTrip}
                    />

                    <M.EditTripModal
                        isOpen={isEditTripOpen}
                        currentTrip={currentTrip}
                        form={editTripForm}
                        setForm={setEditTripForm}
                        onClose={() => setIsEditTripOpen(false)}
                        onSubmit={handleSaveEditTrip}
                    />

                    <M.RateModal
                        isOpen={isRateModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        onClose={() => setIsRateModalOpen(false)}
                        onUpdateBaseRate={(code, val) => {
                            updateCurrentTrip(t => ({ ...t, baseRates: { ...(t.baseRates || {}), [code]: val } }));
                        }}
                        onUpdateDailyRate={(dayNum, currency, rawVal) => {
                            updateCurrentTrip(t => {
                                const nextDaily = { ...(t.dailyRates || {}) };
                                const dayObj = { ...(nextDaily[dayNum] || {}) };
                                if (rawVal === '' || Number(rawVal) <= 0) delete dayObj[currency];
                                else dayObj[currency] = Number(rawVal);
                                nextDaily[dayNum] = dayObj;
                                return { ...t, dailyRates: nextDaily };
                            });
                        }}
                    />

                    <M.SettlementModal
                        isOpen={isSettlementModalOpen}
                        currentTrip={currentTrip}
                        companions={companions}
                        budgetSummary={budgetSummary}
                        onClose={() => setIsSettlementModalOpen(false)}
                        onQuickSettle={handleQuickSettle}
                        onAddManualSettlement={handleAddManualSettlement}
                        onDeleteSettlement={handleDeleteSettlement}
                    />

                    <M.ShareModal
                        isOpen={isShareModalOpen}
                        currentTrip={currentTrip}
                        shareText={shareSummaryText}
                        onClose={() => setIsShareModalOpen(false)}
                        onCopy={(txt) => handleCopyText(txt, '공유 텍스트가 복사되었습니다!')}
                    />

                    <M.TripListModal
                        isOpen={isTripListModalOpen}
                        currentTrip={currentTrip}
                        allVisibleTrips={allVisibleTrips}
                        visiblePrivateTrips={visiblePrivateTrips}
                        visibleSharedTrips={visibleSharedTrips}
                        isAdmin={isAdmin}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsTripListModalOpen(false)}
                        onSelectTrip={handleSelectTrip}
                        onDeleteTrip={handleDeleteTrip}
                        onOpenJoinCode={() => setIsJoinCodeModalOpen(true)}
                        onOpenNewTrip={() => setIsNewTripModalOpen(true)}
                    />

                    <M.JoinCodeModal
                        isOpen={isJoinCodeModalOpen}
                        digits={joinCodeDigits}
                        setDigits={setJoinCodeDigits}
                        onClose={() => setIsJoinCodeModalOpen(false)}
                        onSubmit={handleJoinByCode}
                    />
                </div>
            );
        }

        // 외부 modals.jsx 트랜스파일 완료 보장 후 안전하게 렌더링
        function mountApp(retries = 0) {
            if (window.TripfullModals || retries >= 30) {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(
                    <ErrorBoundary>
                        <App />
                    </ErrorBoundary>
                );
            } else {
                setTimeout(() => mountApp(retries + 1), 100);
            }
        }
        mountApp();
    </script>
</body>
</html>
