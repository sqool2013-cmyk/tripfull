<html lang="ko">
<head>

    <title>Tripfull · 올인원 여행 플래너</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;

    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Compat v10.8.0) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Tripfull v0.2.0 분리 모듈 (캐시 무효화 쿼리 적용) -->
    <script src="./utils.js?v=0.2.0"></script>
    <script src="./budget-engine.js?v=0.2.0"></script>
    <script src="./firebase-api.js?v=0.2.0"></script>
    <script type="text/babel" src="./modals.jsx?v=0.2.0"></script>
</head>
<body class="bg-[#F4F7F9] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200 selection:bg-teal-500 selection:text-white">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center p-6 text-center">
            <div class="space-y-2">
                <div class="text-2xl animate-pulse">✈️</div>
                <div class="text-sm font-extrabold text-slate-600">Tripfull 불러오는 중...</div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;

        const APP_VERSION = 'v.0.2.0';
        const U = window.TripfullUtils;
        const B = window.TripfullBudget;
        const API = window.TripfullAPI;

        // RTDB 배열/객체 호환 정규화 헬퍼
        const toArray = (raw) => {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'object') return Object.values(raw).filter(Boolean);
            return [];
        };

        // ====================================================================
        // 런타임 에러 바운더리 (하얀 화면 원천 방지)
        // ====================================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMsg: error?.message || '알 수 없는 화면 오류' };
            }
            componentDidCatch(error, info) {
                console.error('[Tripfull ErrorBoundary]', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                            <div className="bg-white border border-slate-200 rounded-3xl p-6 max-w-md w-full text-center shadow-lg space-y-3">
                                <div className="text-3xl">🛠️</div>
                                <h2 className="text-base font-extrabold text-slate-800">화면을 표시하는 중 문제가 발생했습니다</h2>
                                <p className="text-xs text-slate-500 break-words">{this.state.errorMsg}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="px-5 py-2.5 rounded-xl bg-[#00C48C] text-white text-xs font-extrabold"
                                >
                                    새로고침하여 복구하기
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ====================================================================
        // 메인 애플리케이션
        // ====================================================================
        function App() {
            const M = window.TripfullModals;

            // presets.json 비동기 로드 상태
            const [presetsVersion, setPresetsVersion] = useState(0);

            // 계정 및 여행 데이터 상태
            const [registeredProfiles, setRegisteredProfiles] = useState(() => API.getCachedProfiles());
            const [isProfilesLoaded, setIsProfilesLoaded] = useState(false);
            const [currentProfile, setCurrentProfile] = useState(() => API.getCachedUser());
            const [allTripsMap, setAllTripsMap] = useState({});
            const [currentTripId, setCurrentTripId] = useState(null);

            // 네트워크·실시간 시각 상태
            const [isDbConnected, setIsDbConnected] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [nowTick, setNowTick] = useState(Date.now());
            const [isAuthSubmitting, setIsAuthSubmitting] = useState(false);

            // 네비게이션 및 알림 상태
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDay, setSelectedDay] = useState(1);
            const [expenseDayFilter, setExpenseDayFilter] = useState('all');
            const [toastMessage, setToastMessage] = useState(null);

            // 모달 열림/닫힘 상태
            const [confirmDialog, setConfirmDialog] = useState({
                isOpen: false, title: '', message: '', confirmText: '삭제하기', tone: 'danger', onConfirm: null
            });
            const [securityCheckModal, setSecurityCheckModal] = useState({
                isOpen: false, title: '', description: '', inputPin: '', onSuccess: null
            });
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [isEditMyProfileOpen, setIsEditMyProfileOpen] = useState(false);
            const [isUserManageModalOpen, setIsUserManageModalOpen] = useState(false);
            const [isTripListModalOpen, setIsTripListModalOpen] = useState(false);
            const [isNewTripModalOpen, setIsNewTripModalOpen] = useState(false);
            const [isEditTripOpen, setIsEditTripOpen] = useState(false);
            const [isPlaceModalOpen, setIsPlaceModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [isRateModalOpen, setIsRateModalOpen] = useState(false);
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [isJoinCodeModalOpen, setIsJoinCodeModalOpen] = useState(false);
            const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
            const [isSettlementModalOpen, setIsSettlementModalOpen] = useState(false);

            // 편집 폼 상태
            const [editingCheckItem, setEditingCheckItem] = useState(null);
            const [editingPlaceInfo, setEditingPlaceInfo] = useState(null);
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            const [joinCodeDigits, setJoinCodeDigits] = useState('');
            const [loginForm, setLoginForm] = useState({ name: '', pin: '', avatar: '' });
            const [editMyProfileForm, setEditMyProfileForm] = useState({ name: '', pin: '', avatar: '✈️' });
            const [newCheckItem, setNewCheckItem] = useState('');

            const todayStr = U.getTodayIso();
            const [newTripForm, setNewTripForm] = useState({
                title: '', country: '대한민국', city: '서울', customDestination: '',
                startDate: todayStr, endDate: todayStr, currency: 'KRW',
                budgetKRW: 1000000, visibility: 'private', invitedUserKeys: []
            });
            const [editTripForm, setEditTripForm] = useState({
                title: '', country: '대한민국', city: '서울', customDestination: '',
                startDate: '', endDate: '', currency: 'KRW', budgetKRW: 0
            });
            const [newPlace, setNewPlace] = useState({
                day: 1, time: '', endTime: '', place: '', address: '',
                category: 'sightseeing', memo: '', cost: '', currency: 'KRW'
            });
            const [isSearchingAddress, setIsSearchingAddress] = useState(false);
            const [addressSearchResults, setAddressSearchResults] = useState([]);
            const [newExpense, setNewExpense] = useState({
                day: 1, title: '', amount: '', currency: 'KRW',
                payerId: 'c1', splitWith: ['c1'], category: 'food', method: 'card'
            });

            // 현재 프리셋 참조
            const presets = useMemo(() => U.getPresets(), [presetsVersion]);
            const CATEGORY_META = presets.categoryMeta || {};
            const CURRENCIES = presets.currencies || {};
            const COUNTRY_PRESETS = presets.countryPresets || {};

            const activeUserKey = useMemo(() => {
                if (currentProfile && currentProfile.key) return U.sanitizeKey(currentProfile.key);
                if (currentProfile && currentProfile.name) return U.sanitizeKey(currentProfile.name);
                return 'guest_user';
            }, [currentProfile]);

            // 서버 DB 프로필의 isAdmin 속성만 신뢰 (로컬 스토리지 위변조 방어)
            const isAdmin = useMemo(() => {
                if (!currentProfile || !isProfilesLoaded) return false;
                const serverProf = registeredProfiles[activeUserKey];
                return Boolean(serverProf && serverProf.isAdmin === true);
            }, [currentProfile, registeredProfiles, activeUserKey, isProfilesLoaded]);

            const isDarkMode = Boolean(currentProfile?.theme === 'dark');

            // 토스트 알림 헬퍼
            const showToast = useCallback((msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3200);
            }, []);

            const askConfirm = ({ title, message, confirmText = '삭제하기', tone = 'danger', onConfirm }) => {
                setConfirmDialog({ isOpen: true, title, message, confirmText, tone, onConfirm });
            };

            const requestSecurityVerification = (title, description, onSuccess) => {
                setSecurityCheckModal({ isOpen: true, title, description, inputPin: '', onSuccess });
            };

            // ================================================================
            // 1. 초기화: presets.json 로드, 다크모드, 시계, Firebase 구독
            // ================================================================
            useEffect(() => {
                U.loadPresets('./presets.json?v=0.2.0').then(() => {
                    setPresetsVersion(v => v + 1);
                });
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            useEffect(() => {
                const timer = setInterval(() => setNowTick(Date.now()), 30000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                API.init();
                const unsubProfiles = API.subscribeProfiles(
                    (val) => {
                        setIsDbConnected(true);
                        setRegisteredProfiles(val);
                        setIsProfilesLoaded(true);
                    },
                    () => setIsDbConnected(false)
                );
                const unsubTrips = API.subscribeTrips(
                    (val) => {
                        setIsDbConnected(true);
                        setAllTripsMap(val);
                    },
                    () => setIsDbConnected(false)
                );
                return () => {
                    unsubProfiles();
                    unsubTrips();
                };
            }, []);

            // 서버 프로필과 현재 세션의 무결성 검증 (계정 삭제 또는 비밀번호 authVersion 변경 시 자동 로그아웃)
            useEffect(() => {
                if (!currentProfile || !isProfilesLoaded) return;
                const serverProf = registeredProfiles[activeUserKey];
                if (!serverProf) {
                    setCurrentProfile(null);
                    API.clearCachedUser();
                    showToast('⚠️ 계정이 존재하지 않거나 삭제되어 로그아웃되었습니다.');
                    return;
                }

                // 비밀번호가 다른 기기/관리자에 의해 변경된 경우(authVersion 불일치) 세션 즉시 무효화
                if (serverProf.authVersion && currentProfile.authVersion && serverProf.authVersion !== currentProfile.authVersion) {
                    setCurrentProfile(null);
                    API.clearCachedUser();
                    showToast('🔐 비밀번호가 변경되어 다시 로그인이 필요합니다.');
                    return;
                }

                const serverIds = JSON.stringify(serverProf.joinedTripIds || []);
                const localIds = JSON.stringify(currentProfile.joinedTripIds || []);
                const serverTheme = serverProf.theme || 'light';
                const localTheme = currentProfile.theme || 'light';
                const serverAdmin = Boolean(serverProf.isAdmin);
                const localAdmin = Boolean(currentProfile.isAdmin);

                if (
                    serverIds !== localIds ||
                    serverProf.name !== currentProfile.name ||
                    serverProf.avatar !== currentProfile.avatar ||
                    serverTheme !== localTheme ||
                    serverAdmin !== localAdmin ||
                    serverProf.authVersion !== currentProfile.authVersion
                ) {
                    const synced = {
                        ...currentProfile,
                        ...serverProf,
                        key: activeUserKey,
                        isAdmin: serverAdmin
                    };
                    delete synced.pin;
                    delete synced.pinHash;
                    setCurrentProfile(synced);
                    API.saveCachedUser(synced);
                }
            }, [registeredProfiles, activeUserKey, isProfilesLoaded]);

            // ================================================================
            // 2. 여행 목록 필터링 및 현재 여행 파생 상태
            // ================================================================
            const visiblePrivateTrips = useMemo(() => {
                const list = Object.values(allTripsMap).filter(t => t && t.visibility === 'private');
                if (isAdmin) return list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                return list
                    .filter(t => U.sanitizeKey(t.ownerKey) === activeUserKey)
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }, [allTripsMap, isAdmin, activeUserKey]);

            const visibleSharedTrips = useMemo(() => {
                const list = Object.values(allTripsMap).filter(t => t && t.visibility !== 'private');
                if (isAdmin) return list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                const joinedIds = toArray(currentProfile?.joinedTripIds);
                return list
                    .filter(t => {
                        const isOwner = U.sanitizeKey(t.ownerKey) === activeUserKey;
                        const isJoined = joinedIds.includes(t.id);
                        const isCompanion = toArray(t.companions).some(c => U.sanitizeKey(c.userKey || c.name) === activeUserKey);
                        return isOwner || isJoined || isCompanion;
                    })
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }, [allTripsMap, isAdmin, currentProfile, activeUserKey]);

            const allVisibleTrips = useMemo(() => {
                return [...visiblePrivateTrips, ...visibleSharedTrips];
            }, [visiblePrivateTrips, visibleSharedTrips]);

            useEffect(() => {
                if (allVisibleTrips.length === 0) {
                    setCurrentTripId(null);
                    return;
                }
                if (!currentTripId || !allVisibleTrips.some(t => t.id === currentTripId)) {
                    setCurrentTripId(allVisibleTrips[0].id);
                }
            }, [allVisibleTrips, currentTripId]);

            const currentTrip = useMemo(() => {
                if (!currentTripId) return allVisibleTrips[0] || null;
                return allVisibleTrips.find(t => t.id === currentTripId) || allVisibleTrips[0] || null;
            }, [allVisibleTrips, currentTripId]);

            const isCurrentTripOwnerOrAdmin = useMemo(() => {
                if (!currentTrip || !currentProfile) return false;
                if (isAdmin) return true;
                return U.sanitizeKey(currentTrip.ownerKey) === activeUserKey;
            }, [currentTrip, currentProfile, isAdmin, activeUserKey]);

            const tripDays = useMemo(() => U.getTripDayNumbers(currentTrip), [currentTrip]);
            const itinerary = currentTrip?.itinerary || {};
            const companions = useMemo(() => toArray(currentTrip?.companions), [currentTrip]);
            const expenses = useMemo(() => toArray(currentTrip?.expenses), [currentTrip]);
            const checklist = useMemo(() => toArray(currentTrip?.checklist), [currentTrip]);

            const localTimeInfo = useMemo(() => U.getLocalTimeInfo(currentTrip, nowTick), [currentTrip, nowTick, presetsVersion]);
            const budgetSummary = useMemo(() => B.calculateBudgetSummary(currentTrip), [currentTrip, presetsVersion]);

            const filteredExpenses = useMemo(() => {
                if (expenseDayFilter === 'all') return expenses;
                return expenses.filter(e => Number(e.day) === Number(expenseDayFilter));
            }, [expenses, expenseDayFilter]);

            const filteredExpenseTotalKRW = useMemo(
                () => B.getFilteredExpenseTotalKRW(currentTrip, filteredExpenses),
                [currentTrip, filteredExpenses, presetsVersion]
            );

            // ================================================================
            // 3. DB 저장 래퍼 함수
            // ================================================================
            const persistProfile = useCallback(async (uKey, profObj) => {
                const cleanKey = U.sanitizeKey(uKey);
                if (!cleanKey) return;
                setRegisteredProfiles(prev => {
                    const next = { ...prev, [cleanKey]: profObj };
                    API.saveCachedProfiles(next);
                    return next;
                });
                try {
                    await API.saveProfile(cleanKey, profObj);
                } catch (err) {
                    console.error('프로필 저장 실패:', err);
                }
            }, []);

            const persistTrip = useCallback((tripObj) => {
                if (!tripObj || !tripObj.id) return;
                setIsSyncing(true);
                setAllTripsMap(prev => ({ ...prev, [tripObj.id]: tripObj }));
                API.saveTrip(tripObj)
                    .then(() => setIsSyncing(false))
                    .catch(err => {
                        console.error('여행 저장 실패:', err);
                        setIsSyncing(false);
                    });
            }, []);

            const updateCurrentTrip = useCallback((updater) => {
                if (!currentTrip) return;
                const updated = typeof updater === 'function' ? updater(currentTrip) : { ...currentTrip, ...updater };
                persistTrip(updated);
            }, [currentTrip, persistTrip]);

            // ================================================================
            // 4. 계정 인증 · 프로필 · 테마 핸들러 (무유출 보안 적용)
            // ================================================================
            const handleVerifySecurityPin = async (e) => {
                e.preventDefault();
                if (!currentProfile) return;
                const serverProf = registeredProfiles[activeUserKey] || currentProfile;
                const res = await API.verifyUserSecret(activeUserKey, securityCheckModal.inputPin, serverProf);
                if (!res.ok) {
                    showToast('❌ 비밀번호가 일치하지 않습니다.');
                    return;
                }
                const cb = securityCheckModal.onSuccess;
                setSecurityCheckModal({ isOpen: false, title: '', description: '', inputPin: '', onSuccess: null });
                if (cb) cb();
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                const name = loginForm.name.trim();
                const pin = loginForm.pin.trim();
                if (!name) return showToast('아이디(이름)를 입력해주세요.');
                if (pin.length < 4) return showToast('비밀번호 4자리 이상을 입력해주세요.');
                if (!isProfilesLoaded) return showToast('서버에서 계정 정보를 불러오는 중입니다. 잠시만 기다려주세요.');

                setIsAuthSubmitting(true);
                try {
                    const cleanKey = U.sanitizeKey(name);
                    const existing = registeredProfiles[cleanKey] ||
                        Object.values(registeredProfiles).find(p => p && p.name === name);

                    if (existing) {
                        const targetKey = U.sanitizeKey(existing.key || existing.name);
                        const verifyRes = await API.verifyUserSecret(targetKey, pin, existing);
                        if (!verifyRes.ok) {
                            showToast('❌ 비밀번호가 일치하지 않습니다.');
                            return;
                        }
                        const baseProf = verifyRes.cleanedProfile || existing;
                        const updated = {
                            ...baseProf,
                            key: targetKey,
                            isAdmin: Boolean(existing.isAdmin),
                            avatar: loginForm.avatar || existing.avatar || '✈️',
                            theme: existing.theme || 'light',
                            secretMode: 'zero-download',
                            authVersion: verifyRes.authVersion || baseProf.authVersion || Date.now(),
                            joinedTripIds: toArray(existing.joinedTripIds),
                            lastLoginAt: Date.now()
                        };
                        delete updated.pin;
                        delete updated.pinHash;

                        await persistProfile(targetKey, updated);
                        setCurrentProfile(updated);
                        API.saveCachedUser(updated);
                        setIsLoginModalOpen(false);
                        setLoginForm({ name: '', pin: '', avatar: '' });
                        showToast(
                            verifyRes.migrated
                                ? `🛡️ 무유출 보안 적용 완료! 반갑습니다, ${updated.avatar} ${updated.name}님!`
                                : `👋 반갑습니다, ${updated.avatar} ${updated.name}님!`
                        );
                    } else {
                        const isFirstAccountEver = Object.keys(registeredProfiles).length === 0;
                        const newProf = await API.registerNewProfile({
                            name,
                            pin,
                            avatar: loginForm.avatar || '✈️',
                            isAdmin: isFirstAccountEver,
                            theme: 'light'
                        });
                        setRegisteredProfiles(prev => {
                            const next = { ...prev, [newProf.key]: newProf };
                            API.saveCachedProfiles(next);
                            return next;
                        });
                        setCurrentProfile(newProf);
                        API.saveCachedUser(newProf);
                        setIsLoginModalOpen(false);
                        setLoginForm({ name: '', pin: '', avatar: '' });
                        showToast(`🎉 '${name}' 계정이 안전하게 등록되었습니다!`);
                    }
                } catch (err) {
                    console.error('로그인 처리 오류:', err);
                    showToast('❌ 로그인 처리 중 오류가 발생했습니다.');
                } finally {
                    setIsAuthSubmitting(false);
                }
            };

            const handleSaveMyProfile = async (e) => {
                e.preventDefault();
                if (!currentProfile) return;
                const nextName = editMyProfileForm.name.trim();
                const nextPin = editMyProfileForm.pin.trim();
                const nextAvatar = editMyProfileForm.avatar || '✈️';

                if (!nextName) return showToast('이름을 입력해주세요.');
                if (nextPin && nextPin.length < 4) return showToast('새 비밀번호는 4자리 이상으로 입력해주세요.');

                const oldKey = U.sanitizeKey(currentProfile.key || currentProfile.name);
                const isDuplicateName = Object.entries(registeredProfiles).some(([uKey, prof]) => {
                    if (U.sanitizeKey(uKey) === oldKey) return false;
                    return prof && (
                        prof.name.trim().toLowerCase() === nextName.toLowerCase() ||
                        U.sanitizeKey(prof.name) === U.sanitizeKey(nextName)
                    );
                });
                if (isDuplicateName) return showToast('❌ 이미 다른 사용자가 사용 중인 이름입니다.');

                try {
                    let updatedProf = {
                        ...currentProfile,
                        key: oldKey,
                        name: nextName,
                        avatar: nextAvatar,
                        isAdmin: Boolean(registeredProfiles[oldKey]?.isAdmin)
                    };
                    if (nextPin) {
                        updatedProf = await API.updateUserPassword(oldKey, nextPin, updatedProf);
                    } else {
                        await persistProfile(oldKey, updatedProf);
                    }

                    setCurrentProfile(updatedProf);
                    API.saveCachedUser(updatedProf);

                    // 참여 중인 모든 여행의 멤버 표시 정보 동기화
                    Object.values(allTripsMap).forEach(t => {
                        if (!t) return;
                        let changed = false;
                        const nextCompanions = toArray(t.companions).map(c => {
                            if (U.sanitizeKey(c.userKey) === oldKey || c.name === currentProfile.name) {
                                changed = true;
                                return { ...c, name: nextName, avatar: nextAvatar, userKey: oldKey };
                            }
                            return c;
                        });
                        const nextOwnerName = U.sanitizeKey(t.ownerKey) === oldKey ? nextName : t.ownerName;
                        if (changed || nextOwnerName !== t.ownerName) {
                            persistTrip({ ...t, ownerName: nextOwnerName, companions: nextCompanions });
                        }
                    });

                    setIsEditMyProfileOpen(false);
                    showToast('✅ 내 프로필 정보가 수정되었습니다.');
                } catch (err) {
                    showToast('❌ 프로필 저장 중 오류가 발생했습니다.');
                }
            };

            const handleToggleTheme = () => {
                if (!currentProfile) return;
                const nextTheme = isDarkMode ? 'light' : 'dark';
                const cleanK = U.sanitizeKey(currentProfile.key || currentProfile.name);
                const updated = { ...currentProfile, key: cleanK, theme: nextTheme };
                setCurrentProfile(updated);
                API.saveCachedUser(updated);
                persistProfile(cleanK, updated);
                showToast(nextTheme === 'dark' ? '🌙 다크 모드가 적용되었습니다.' : '☀️ 라이트 모드가 적용되었습니다.');
            };

            // ================================================================
            // 5. 여행 CRUD & 초대코드 · 멤버 핸들러
            // ================================================================
            const handleSelectTrip = (id) => {
                if (!allTripsMap[id]) return;
                setCurrentTripId(id);
                setSelectedDay(1);
                setExpenseDayFilter('all');
                setIsTripListModalOpen(false);
            };

            const handleCreateNewTrip = (e) => {
                e.preventDefault();
                if (!currentProfile) return;
                const destinationStr = newTripForm.country === '직접 입력'
                    ? newTripForm.customDestination.trim()
                    : `${newTripForm.country} ${newTripForm.city === '직접 입력' ? newTripForm.customDestination.trim() : newTripForm.city}`.trim();

                if (!newTripForm.title.trim() || !destinationStr) return showToast('여행 명칭과 국가/도시를 입력해주세요.');
                if (newTripForm.endDate < newTripForm.startDate) return showToast('⚠️ 도착일이 출발일보다 빠를 수 없습니다.');

                const sParts = newTripForm.startDate.split('-').map(Number);
                const eParts = newTripForm.endDate.split('-').map(Number);
                const diffDays = Math.max(1, Math.min(30, Math.round((new Date(eParts[0], eParts[1] - 1, eParts[2]) - new Date(sParts[0], sParts[1] - 1, sParts[2])) / 86400000) + 1));

                const initialItinerary = {};
                for (let d = 1; d <= diffDays; d++) initialItinerary[d] = [];

                const curr = newTripForm.currency;
                const shareCode = U.generateUniqueShareCode(allTripsMap);
                const newTripId = 'trip_' + Date.now();
                const countryMeta = COUNTRY_PRESETS[newTripForm.country] || COUNTRY_PRESETS['직접 입력'];

                const baseCompanions = [
                    { id: 'c1', name: currentProfile.name, userKey: activeUserKey, avatar: currentProfile.avatar || '✈️', color: 'bg-teal-500' }
                ];
                const colors = ['bg-indigo-500', 'bg-rose-500', 'bg-amber-500', 'bg-cyan-500', 'bg-purple-500'];

                if (newTripForm.visibility === 'shared' && newTripForm.invitedUserKeys.length > 0) {
                    newTripForm.invitedUserKeys.forEach((uKey, idx) => {
                        const prof = registeredProfiles[uKey];
                        if (prof && U.sanitizeKey(uKey) !== activeUserKey) {
                            baseCompanions.push({
                                id: 'c_inv_' + Date.now() + '_' + idx,
                                name: prof.name,
                                userKey: uKey,
                                avatar: prof.avatar || '✈️',
                                color: colors[idx % colors.length]
                            });
                            const joined = toArray(prof.joinedTripIds);
                            if (!joined.includes(newTripId)) {
                                persistProfile(uKey, { ...prof, joinedTripIds: [...joined, newTripId] });
                            }
                        }
                    });
                }

                const defaultChecklist = (countryMeta?.presets || []).map((text, idx) => ({
                    id: `chk_${Date.now()}_${idx}`, text, checkedBy: {}
                }));

                const createdTrip = {
                    id: newTripId,
                    shareCode,
                    visibility: newTripForm.visibility,
                    ownerKey: activeUserKey,
                    ownerName: currentProfile.name,
                    title: newTripForm.title.trim(),
                    country: newTripForm.country,
                    city: newTripForm.city,
                    destination: destinationStr,
                    startDate: newTripForm.startDate,
                    endDate: newTripForm.endDate,
                    currency: curr,
                    exchangeRate: CURRENCIES[curr]?.defaultRate || 1,
                    baseRates: { [curr]: CURRENCIES[curr]?.defaultRate || 1, USD: 1380, JPY: 905, EUR: 1490, KRW: 1 },
                    dailyRates: {},
                    budgetKRW: Number(newTripForm.budgetKRW) || 1000000,
                    createdAt: Date.now(),
                    companions: baseCompanions,
                    itinerary: initialItinerary,
                    expenses: [],
                    settlements: [],
                    checklist: defaultChecklist
                };

                if (newTripForm.visibility === 'shared') {
                    const myJoined = toArray(currentProfile.joinedTripIds);
                    const updatedMe = { ...currentProfile, joinedTripIds: [...new Set([...myJoined, newTripId])] };
                    setCurrentProfile(updatedMe);
                    API.saveCachedUser(updatedMe);
                    persistProfile(activeUserKey, updatedMe);
                }

                persistTrip(createdTrip);
                setCurrentTripId(createdTrip.id);
                setSelectedDay(1);
                setIsNewTripModalOpen(false);
                showToast(`🎉 '${createdTrip.title}' 여행이 생성되었습니다!`);
            };

            const openEditTripModal = () => {
                if (!currentTrip) return;
                const matchedCountry = currentTrip.country && COUNTRY_PRESETS[currentTrip.country]
                    ? currentTrip.country
                    : '직접 입력';
                setEditTripForm({
                    title: currentTrip.title,
                    country: matchedCountry,
                    city: currentTrip.city || (COUNTRY_PRESETS[matchedCountry]?.cities?.[0] || '직접 입력'),
                    customDestination: currentTrip.destination || '',
                    startDate: currentTrip.startDate,
                    endDate: currentTrip.endDate,
                    currency: currentTrip.currency || 'KRW',
                    budgetKRW: currentTrip.budgetKRW || 0
                });
                setIsEditTripOpen(true);
            };

            const handleSaveEditTrip = (e) => {
                e.preventDefault();
                if (!currentTrip || !editTripForm.title.trim()) return;
                if (editTripForm.endDate < editTripForm.startDate) return showToast('⚠️ 도착일이 출발일보다 빠를 수 없습니다.');

                const destinationStr = editTripForm.country === '직접 입력'
                    ? editTripForm.customDestination.trim()
                    : `${editTripForm.country} ${editTripForm.city === '직접 입력' ? editTripForm.customDestination.trim() : editTripForm.city}`.trim();

                updateCurrentTrip(t => ({
                    ...t,
                    title: editTripForm.title.trim(),
                    country: editTripForm.country,
                    city: editTripForm.city,
                    destination: destinationStr,
                    startDate: editTripForm.startDate,
                    endDate: editTripForm.endDate,
                    currency: editTripForm.currency,
                    budgetKRW: Number(editTripForm.budgetKRW) || 0
                }));
                setIsEditTripOpen(false);
                showToast('✏️ 여행 정보가 수정되었습니다.');
            };

            const handleDeleteTrip = (tripObj, e) => {
                if (e) e.stopPropagation();
                if (!tripObj) return;
                const isOwner = isAdmin || U.sanitizeKey(tripObj.ownerKey) === activeUserKey;

                askConfirm({
                    title: isOwner ? '여행 영구 삭제' : '공유 여행 나가기',
                    message: isOwner
                        ? `'${tripObj.title}' 여행을 삭제하시겠습니까? 모든 일정과 가계부 기록이 영구 삭제됩니다.`
                        : `'${tripObj.title}' 공유 여행 목록에서 나가시겠습니까?`,
                    confirmText: isOwner ? '영구 삭제' : '목록에서 나가기',
                    onConfirm: () => {
                        if (isOwner) {
                            setAllTripsMap(prev => {
                                const next = { ...prev };
                                delete next[tripObj.id];
                                return next;
                            });
                            API.deleteTrip(tripObj.id);
                            showToast(`🗑️ '${tripObj.title}' 여행이 삭제되었습니다.`);
                        } else {
                            const nextJoined = toArray(currentProfile?.joinedTripIds).filter(id => id !== tripObj.id);
                            const updatedProf = { ...currentProfile, joinedTripIds: nextJoined };
                            setCurrentProfile(updatedProf);
                            API.saveCachedUser(updatedProf);
                            persistProfile(activeUserKey, updatedProf);
                            const nextCompanions = toArray(tripObj.companions).filter(c => U.sanitizeKey(c.userKey || c.name) !== activeUserKey);
                            persistTrip({ ...tripObj, companions: nextCompanions });
                            showToast(`👋 '${tripObj.title}' 여행에서 나갔습니다.`);
                        }
                    }
                });
            };

            const handleJoinByCode = (e) => {
                e.preventDefault();
                const digits = joinCodeDigits.trim();
                if (digits.length < 4) return showToast('4자리 코드를 입력해주세요.');
                const fullCode = `TRIP-${digits}`.toUpperCase();
                const found = Object.values(allTripsMap).find(t => t && (t.shareCode || '').toUpperCase() === fullCode);
                if (!found) return showToast('❌ 일치하는 초대 코드의 공유 여행을 찾을 수 없습니다.');

                const currentJoined = toArray(currentProfile?.joinedTripIds);
                const nextJoined = currentJoined.includes(found.id) ? currentJoined : [...currentJoined, found.id];
                const updatedProfile = { ...currentProfile, joinedTripIds: nextJoined };
                setCurrentProfile(updatedProfile);
                API.saveCachedUser(updatedProfile);
                persistProfile(activeUserKey, updatedProfile);

                const alreadyMember = toArray(found.companions).some(c => U.sanitizeKey(c.userKey || c.name) === activeUserKey);
                if (!alreadyMember && currentProfile) {
                    persistTrip({
                        ...found,
                        companions: [...toArray(found.companions), {
                            id: 'c_' + Date.now(),
                            name: currentProfile.name,
                            userKey: activeUserKey,
                            avatar: currentProfile.avatar || '✈️',
                            color: 'bg-indigo-500'
                        }]
                    });
                }

                setCurrentTripId(found.id);
                setJoinCodeDigits('');
                setIsJoinCodeModalOpen(false);
                showToast(`🎉 '${found.title}' 공유 여행이 내 계정에 연동되었습니다!`);
            };

            const handleInviteRegisteredUser = (uKey) => {
                if (!currentTrip || !isCurrentTripOwnerOrAdmin) return;
                const prof = registeredProfiles[uKey];
                if (!prof) return;

                let nextTrip = { ...currentTrip };
                if (nextTrip.visibility === 'private') nextTrip.visibility = 'shared';

                const currentComps = toArray(nextTrip.companions);
                const alreadyIn = currentComps.some(c => U.sanitizeKey(c.userKey || c.name) === U.sanitizeKey(uKey));
                if (!alreadyIn) {
                    nextTrip.companions = [...currentComps, {
                        id: 'c_' + Date.now(),
                        name: prof.name,
                        userKey: U.sanitizeKey(uKey),
                        avatar: prof.avatar || '✈️',
                        color: 'bg-indigo-500'
                    }];
                }
                persistTrip(nextTrip);

                const joined = toArray(prof.joinedTripIds);
                if (!joined.includes(nextTrip.id)) {
                    persistProfile(uKey, { ...prof, joinedTripIds: [...joined, nextTrip.id] });
                }
                showToast(`✅ '${prof.name}' 님을 이 여행에 초대했습니다!`);
            };

            // ================================================================
            // 6. 일정(장소) 핸들러
            // ================================================================
            const handleSearchAddress = async () => {
                const query = (newPlace.place || newPlace.address || '').trim();
                if (!query) return showToast('장소명이나 검색할 키워드를 먼저 입력해주세요.');
                setIsSearchingAddress(true);
                setAddressSearchResults([]);
                try {
                    const destHint = currentTrip?.country === '직접 입력' ? '' : (currentTrip?.city || currentTrip?.country || '');
                    const data = await U.searchAddressNominatim(query, destHint);
                    if (data.length > 0) {
                        setAddressSearchResults(data);
                        const firstClean = U.formatKoreanAddress(data[0].display_name, newPlace.place);
                        setNewPlace(prev => ({ ...prev, address: prev.address || firstClean }));
                    } else {
                        showToast('검색 결과가 없습니다. 직접 주소를 입력하실 수 있습니다.');
                    }
                } catch (e) {
                    showToast('주소 검색 서버 연결에 실패했습니다.');
                } finally {
                    setIsSearchingAddress(false);
                }
            };

            const openAddPlaceModal = () => {
                setEditingPlaceInfo(null);
                setAddressSearchResults([]);
                setNewPlace({
                    day: selectedDay, time: '', endTime: '', place: '', address: '',
                    category: 'sightseeing', memo: '', cost: '', currency: currentTrip?.currency || 'KRW'
                });
                setIsPlaceModalOpen(true);
            };

            const openEditPlaceModal = (dayNum, item) => {
                setEditingPlaceInfo({ day: Number(dayNum), id: item.id });
                setAddressSearchResults([]);
                setNewPlace({
                    day: Number(dayNum),
                    time: item.time || '',
                    endTime: item.endTime || '',
                    place: item.place,
                    address: item.address || '',
                    category: item.category || 'sightseeing',
                    memo: item.memo || '',
                    cost: item.cost ? String(item.cost) : '',
                    currency: item.currency || currentTrip?.currency || 'KRW'
                });
                setIsPlaceModalOpen(true);
            };

            const handleSavePlace = (e) => {
                e.preventDefault();
                if (!newPlace.place.trim() || !currentTrip) return;
                if (newPlace.time && newPlace.endTime && newPlace.endTime < newPlace.time) {
                    return showToast('⚠️ 종료 시각이 방문 시각보다 빠릅니다.');
                }
                const targetDay = Number(newPlace.day) || selectedDay;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const itemData = {
                    id: editingPlaceInfo ? editingPlaceInfo.id : 'i_' + Date.now(),
                    time: newPlace.time,
                    endTime: newPlace.endTime || '',
                    place: newPlace.place.trim(),
                    address: newPlace.address.trim(),
                    category: newPlace.category,
                    memo: newPlace.memo.trim(),
                    cost: Number(newPlace.cost) || 0,
                    currency: newPlace.currency || currentTrip.currency,
                    updatedBy: authorTag
                };

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    if (editingPlaceInfo && Number(editingPlaceInfo.day) === targetDay) {
                        const dayList = [...toArray(nextItin[targetDay])];
                        const sameIdx = dayList.findIndex(x => x.id === editingPlaceInfo.id);
                        if (sameIdx !== -1) {
                            dayList[sameIdx] = itemData;
                            nextItin[targetDay] = dayList;
                            return { ...t, itinerary: nextItin };
                        }
                    }
                    if (editingPlaceInfo && nextItin[editingPlaceInfo.day]) {
                        nextItin[editingPlaceInfo.day] = toArray(nextItin[editingPlaceInfo.day]).filter(x => x.id !== editingPlaceInfo.id);
                    }
                    nextItin[targetDay] = [...toArray(nextItin[targetDay]), itemData];
                    return { ...t, itinerary: nextItin };
                });

                setSelectedDay(targetDay);
                setIsPlaceModalOpen(false);
                showToast(editingPlaceInfo ? '✏️ 일정이 수정되었습니다.' : `✅ ${targetDay}일차에 '${itemData.place}' 일정이 추가되었습니다.`);
            };

            const handleDeletePlace = (day, item, e) => {
                if (e) e.stopPropagation();
                askConfirm({
                    title: '일정 삭제 확인',
                    message: `${day}일차의 [${item.place}] 일정을 정말 삭제하시겠습니까?`,
                    onConfirm: () => {
                        updateCurrentTrip(t => ({
                            ...t,
                            itinerary: { ...t.itinerary, [day]: toArray(t.itinerary?.[day]).filter(x => x.id !== item.id) }
                        }));
                        showToast('🗑️ 일정이 삭제되었습니다.');
                    }
                });
            };

            const movePlaceOrder = (dayNum, index, direction, e) => {
                if (e) e.stopPropagation();
                if (!currentTrip) return;
                const list = [...toArray(currentTrip.itinerary?.[dayNum])];
                if (list.length <= 1) return;

                let targetIndex = index;
                if (direction === 'top') targetIndex = 0;
                else if (direction === 'up') targetIndex = Math.max(0, index - 1);
                else if (direction === 'down') targetIndex = Math.min(list.length - 1, index + 1);
                else if (direction === 'bottom') targetIndex = list.length - 1;
                if (targetIndex === index) return;

                const [moved] = list.splice(index, 1);
                list.splice(targetIndex, 0, moved);
                updateCurrentTrip(t => ({ ...t, itinerary: { ...t.itinerary, [dayNum]: list } }));
            };

            // ================================================================
            // 7. 가계부 지출 & [v0.2.0] 중간 정산 핸들러
            // ================================================================
            const openAddExpenseModal = (defaultDay = null) => {
                if (!currentTrip) return;
                setEditingExpenseId(null);
                const resolvedDay = defaultDay !== null
                    ? defaultDay
                    : (expenseDayFilter === 'all' ? selectedDay : Number(expenseDayFilter));
                setNewExpense({
                    day: resolvedDay, title: '', amount: '',
                    currency: currentTrip.currency,
                    payerId: companions[0]?.id || 'c1',
                    splitWith: companions.map(c => c.id),
                    category: 'food', method: 'card'
                });
                setIsExpenseModalOpen(true);
            };

            const openEditExpenseModal = (exp) => {
                setEditingExpenseId(exp.id);
                setNewExpense({
                    day: exp.day !== undefined ? Number(exp.day) : 1,
                    title: exp.title,
                    amount: String(exp.amount),
                    currency: exp.currency,
                    payerId: exp.payerId,
                    splitWith: toArray(exp.splitWith),
                    category: exp.category || 'food',
                    method: exp.method || 'card'
                });
                setIsExpenseModalOpen(true);
            };

            const handleSaveExpense = (e) => {
                e.preventDefault();
                if (!newExpense.title.trim() || !newExpense.amount || !currentTrip) return;
                if (newExpense.splitWith.length === 0) return showToast('함께 정산할 인원을 최소 1명 이상 선택해주세요.');

                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const itemData = {
                    id: editingExpenseId || 'e_' + Date.now(),
                    day: Number(newExpense.day),
                    title: newExpense.title.trim(),
                    amount: Number(newExpense.amount),
                    currency: newExpense.currency,
                    payerId: newExpense.payerId,
                    splitWith: newExpense.splitWith,
                    category: newExpense.category,
                    method: newExpense.method,
                    updatedBy: authorTag
                };
                updateCurrentTrip(t => ({
                    ...t,
                    expenses: editingExpenseId
                        ? toArray(t.expenses).map(x => x.id === editingExpenseId ? itemData : x)
                        : [itemData, ...toArray(t.expenses)]
                }));
                setIsExpenseModalOpen(false);
                showToast(editingExpenseId ? '✏️ 지출 내역이 수정되었습니다.' : '💰 가계부에 지출이 기록되었습니다.');
            };

            const handleDeleteExpense = (exp, e) => {
                if (e) e.stopPropagation();
                askConfirm({
                    title: '지출 내역 삭제 확인',
                    message: `[${exp.title} - ${Number(exp.amount).toLocaleString()} ${exp.currency}] 내역을 삭제하시겠습니까?`,
                    onConfirm: () => {
                        updateCurrentTrip(t => ({ ...t, expenses: toArray(t.expenses).filter(x => x.id !== exp.id) }));
                        showToast('🗑️ 지출 내역이 삭제되었습니다.');
                    }
                });
            };

            const moveExpenseOrder = (expId, direction, filteredList, e) => {
                if (e) e.stopPropagation();
                if (!currentTrip) return;
                const fullList = [...expenses];
                const curIdx = filteredList.findIndex(x => x.id === expId);
                if (curIdx === -1 || filteredList.length <= 1) return;

                let targetIdx = curIdx;
                if (direction === 'top') targetIdx = 0;
                else if (direction === 'up') targetIdx = Math.max(0, curIdx - 1);
                else if (direction === 'down') targetIdx = Math.min(filteredList.length - 1, curIdx + 1);
                else if (direction === 'bottom') targetIdx = filteredList.length - 1;
                if (targetIdx === curIdx) return;

                const targetId = filteredList[targetIdx].id;
                const fromFull = fullList.findIndex(x => x.id === expId);
                const toFull = fullList.findIndex(x => x.id === targetId);
                if (fromFull === -1 || toFull === -1) return;

                const [moved] = fullList.splice(fromFull, 1);
                fullList.splice(toFull, 0, moved);
                updateCurrentTrip(t => ({ ...t, expenses: fullList }));
            };

                    confirmText: '정산 완료 반영',
                    tone: 'primary',
                    onConfirm: () => {
                        const record = B.createSettlementRecord({
                            fromId: transfer.fromId,
                            toId: transfer.toId,
                            amountKRW: transfer.amount,
                            memo: '원클릭 중간 정산',
                            createdBy: currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : ''

                        updateCurrentTrip(t => ({

                            settlements: [record, ...B.normalizeSettlements(t.settlements)]

                        showToast(`✅ ${transfer.from} ➔ ${transfer.to} ${Number(transfer.amount).toLocaleString()}원 정산이 반영되었습니다!`);

                    return false;
                }
                const record = B.createSettlementRecord({
                    fromId,
                    toId,
                    amountKRW,
                    memo,
                    createdBy: currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : ''
                });
                updateCurrentTrip(t => ({
                    ...t,
                    settlements: [record, ...B.normalizeSettlements(t.settlements)]

                showToast(`✅ ${Number(amountKRW).toLocaleString()}원 중간 정산 송금이 기록되었습니다.`);
                return true;

                    }

                                                            <thead>
                                                                <tr className="bg-slate-50 border-b border-slate-200">
                                                                    <th className="sticky left-0 z-10 bg-slate-50 py-3 px-4 text-xs sm:text-sm font-extrabold text-slate-700 min-w-[200px] border-r">준비물 항목 (클릭 시 수정)</th>
                                                                    {companions.map(comp => (
                                                                        <th key={comp.id} className="py-2.5 px-3 text-center min-w-[90px] border-r">
                                                                            <div className="text-xs sm:text-sm font-extrabold text-slate-800">{comp.avatar} {comp.name}</div>
                                                                        </th>
                                                                    ))}
                                                                    <th className="py-3 px-3 text-center text-xs font-bold text-slate-400 w-24">관리</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-200">
                                                                {checklist.map(item => (
                                                                    <tr key={item.id} className="hover:bg-slate-50/60">
                                                                        <td
                                                                            onClick={() => setEditingCheckItem({ id: item.id, text: item.text })}
                                                                            className="sticky left-0 z-10 py-3.5 px-4 bg-white border-r cursor-pointer hover:text-[#00A878]"
                                                                        >
                                                                            <span className="text-xs sm:text-sm font-extrabold text-slate-800 hover:underline">{item.text}</span>
                                                                        </td>
                                                                        {companions.map(comp => {
                                                                            const checked = isItemCheckedByCompanion(item, comp.id);
                                                                            return (
                                                                                <td
                                                                                    key={comp.id}
                                                                                    onClick={() => {
                                                                                        updateCurrentTrip(t => ({
                                                                                            ...t,
                                                                                            checklist: toArray(t.checklist).map(c => {
                                                                                                if (c.id !== item.id) return c;
                                                                                                const prevMap = (c.checkedBy && typeof c.checkedBy === 'object') ? { ...c.checkedBy } : {};
                                                                                                prevMap[comp.id] = !checked;
                                                                                                return { ...c, checkedBy: prevMap };
                                                                                            })
                                                                                        }));
                                                                                    }}
                                                                                    className="py-3 px-3 text-center border-r cursor-pointer select-none"
                                                                                >
                                                                                    <button type="button" className={`w-7 h-7 mx-auto rounded-xl flex items-center justify-center text-xs font-black border transition ${checked ? 'bg-[#00C48C] border-[#00C48C] text-white' : 'bg-slate-50 border-slate-200 text-transparent'}`}>✓</button>
                                                                                </td>
                                                                            );
                                                                        })}
                                                                        <td className="py-3 px-2 text-center whitespace-nowrap space-x-1.5">
                                                                            <button onClick={() => setEditingCheckItem({ id: item.id, text: item.text })} className="text-xs font-bold text-slate-600 hover:text-[#00A878]">수정</button>
                                                                            <button
                                                                                onClick={() => {
                                                                                    askConfirm({
                                                                                        title: '준비물 삭제',
                                                                                        message: `[${item.text}] 항목을 삭제하시겠습니까?`,
                                                                                        onConfirm: () => {
                                                                                            updateCurrentTrip(t => ({ ...t, checklist: toArray(t.checklist).filter(c => c.id !== item.id) }));
                                                                                        }
                                                                                    });
                                                                                }}
                                                                                className="text-xs font-bold text-rose-500"
                                                                            >
                                                                                삭제
                                                                            </button>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>
                        </>
                    )}

                    {/* ==================== 분리된 모달 컴포넌트 마운트 ==================== */}
                    <M.SecurityCheckModal
                        modalState={securityCheckModal}
                        setModalState={setSecurityCheckModal}
                        onVerify={handleVerifySecurityPin}
                    />

                    <M.EditCheckItemModal
                        editingCheckItem={editingCheckItem}
                        setEditingCheckItem={setEditingCheckItem}
                        onSave={(id, nextText) => {
                            updateCurrentTrip(t => ({
                                ...t,
                                checklist: toArray(t.checklist).map(c => c.id === id ? { ...c, text: nextText } : c)
                            }));
                            setEditingCheckItem(null);
                            showToast('✏️ 준비물 항목이 수정되었습니다.');
                        }}
                    />

                    <M.ConfirmDialogModal
                        confirmDialog={confirmDialog}
                        setConfirmDialog={setConfirmDialog}
                    />

                    <M.LoginModal
                        isOpen={isLoginModalOpen}
                        currentProfile={currentProfile}
                        appVersion={APP_VERSION}
                        registeredProfiles={registeredProfiles}
                        isProfilesLoaded={isProfilesLoaded}
                        loginForm={loginForm}
                        setLoginForm={setLoginForm}
                        isSubmitting={isAuthSubmitting}
                        onClose={() => setIsLoginModalOpen(false)}
                        onSubmit={handleLoginSubmit}
                    />

                    <M.EditMyProfileModal
                        isOpen={isEditMyProfileOpen}
                        currentProfile={currentProfile}
                        form={editMyProfileForm}
                        setForm={setEditMyProfileForm}
                        onClose={() => setIsEditMyProfileOpen(false)}
                        onSubmit={handleSaveMyProfile}
                    />

                    <M.UserManageModal
                        isOpen={isUserManageModalOpen}
                        isAdmin={isAdmin}
                        activeUserKey={activeUserKey}
                        registeredProfiles={registeredProfiles}
                        onClose={() => setIsUserManageModalOpen(false)}
                        onToggleAdmin={(uKey, prof) => {
                            const nextAdmin = !prof.isAdmin;
                            persistProfile(uKey, { ...prof, isAdmin: nextAdmin });
                            showToast(nextAdmin ? `👑 '${prof.name}' 님에게 관리자 권한을 부여했습니다.` : `'${prof.name}' 님의 관리자 권한을 해제했습니다.`);
                        }}
                        onResetPassword={async (uKey, prof, rawPin) => {
                            if (!rawPin || rawPin.trim().length < 4) {
                                showToast('비밀번호는 4자리 이상이어야 합니다.');
                                return false;
                            }
                            try {
                                await API.updateUserPassword(uKey, rawPin.trim(), prof);
                                showToast('🛡️ 비밀번호가 무유출 보안 방식으로 변경되었습니다.');
                                return true;
                            } catch (e) {
                                showToast('❌ 비밀번호 변경에 실패했습니다.');
                                return false;
                            }
                        }}
                        onDeleteUser={(uKey, prof) => {
                            askConfirm({
                                title: '사용자 계정 삭제',
                                message: `'${prof.name}' 계정을 영구 삭제하시겠습니까?`,
                                onConfirm: () => {
                                    API.deleteProfile(uKey);
                                    showToast('계정이 삭제되었습니다.');
                                }
                            });
                        }}
                    />

                    <M.MemberModal
                        isOpen={isMemberModalOpen}
                        currentTrip={currentTrip}
                        companions={companions}
                        registeredProfiles={registeredProfiles}
                        activeUserKey={activeUserKey}
                        isOwnerOrAdmin={isCurrentTripOwnerOrAdmin}
                        onClose={() => setIsMemberModalOpen(false)}
                        onChangeVisibility={(v) => updateCurrentTrip({ visibility: v })}
                        onInviteUser={handleInviteRegisteredUser}
                        onAddManualCompanion={(name) => {
                            const newComp = { id: 'c_' + Date.now(), name, avatar: '🧳', color: 'bg-indigo-500' };
                            updateCurrentTrip(t => ({ ...t, companions: [...toArray(t.companions), newComp] }));
                        }}
                        onKickCompanion={(comp) => {
                            const compKey = U.sanitizeKey(comp.userKey || comp.name);
                            askConfirm({
                                title: '멤버 퇴출 확인',
                                message: `'${comp.name}' 님을 멤버에서 제외하시겠습니까?`,
                                confirmText: '퇴출하기',
                                onConfirm: () => {
                                    updateCurrentTrip(t => ({ ...t, companions: toArray(t.companions).filter(c => c.id !== comp.id) }));
                                    const targetProf = registeredProfiles[compKey];
                                    if (targetProf && Array.isArray(targetProf.joinedTripIds)) {
                                        persistProfile(compKey, {
                                            ...targetProf,
                                            joinedTripIds: targetProf.joinedTripIds.filter(id => id !== currentTrip.id)
                                        });
                                    }
                                    showToast(`'${comp.name}' 님이 멤버에서 제외되었습니다.`);
                                }
                            });
                        }}
                        onLeaveTrip={() => handleDeleteTrip(currentTrip)}
                    />

                    <M.PlaceModal
                        isOpen={isPlaceModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        editingPlaceInfo={editingPlaceInfo}
                        newPlace={newPlace}
                        setNewPlace={setNewPlace}
                        isSearchingAddress={isSearchingAddress}
                        addressSearchResults={addressSearchResults}
                        setAddressSearchResults={setAddressSearchResults}
                        onSearchAddress={handleSearchAddress}
                        onClose={() => setIsPlaceModalOpen(false)}
                        onSubmit={handleSavePlace}
                    />

                    <M.ExpenseModal
                        isOpen={isExpenseModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        companions={companions}
                        editingExpenseId={editingExpenseId}
                        newExpense={newExpense}
                        setNewExpense={setNewExpense}
                        onClose={() => setIsExpenseModalOpen(false)}
                        onSubmit={handleSaveExpense}
                    />

                    <M.NewTripModal
                        isOpen={isNewTripModalOpen}
                        form={newTripForm}
                        setForm={setNewTripForm}
                        registeredProfiles={registeredProfiles}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsNewTripModalOpen(false)}
                        onSubmit={handleCreateNewTrip}
                    />

                    <M.EditTripModal
                        isOpen={isEditTripOpen}
                        currentTrip={currentTrip}
                        form={editTripForm}
                        setForm={setEditTripForm}
                        onClose={() => setIsEditTripOpen(false)}
                        onSubmit={handleSaveEditTrip}
                    />

                    <M.RateModal
                        isOpen={isRateModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        onClose={() => setIsRateModalOpen(false)}
                        onUpdateBaseRate={(code, val) => {
                            updateCurrentTrip(t => ({ ...t, baseRates: { ...(t.baseRates || {}), [code]: val } }));
                        }}
                        onUpdateDailyRate={(dayNum, currency, rawVal) => {
                            updateCurrentTrip(t => {
                                const nextDaily = { ...(t.dailyRates || {}) };
                                const dayObj = { ...(nextDaily[dayNum] || {}) };
                                if (rawVal === '' || Number(rawVal) <= 0) delete dayObj[currency];
                                else dayObj[currency] = Number(rawVal);
                                nextDaily[dayNum] = dayObj;
                                return { ...t, dailyRates: nextDaily };
                            });
                        }}
                    />

                    <M.SettlementModal
                        isOpen={isSettlementModalOpen}
                        currentTrip={currentTrip}
                        companions={companions}
                        budgetSummary={budgetSummary}
                        onClose={() => setIsSettlementModalOpen(false)}
                        onQuickSettle={handleQuickSettle}
                        onAddManualSettlement={handleAddManualSettlement}
                        onDeleteSettlement={handleDeleteSettlement}
                    />

                    <M.ShareModal
                        isOpen={isShareModalOpen}
                        currentTrip={currentTrip}
                        shareText={shareSummaryText}
                        onClose={() => setIsShareModalOpen(false)}
                        onCopy={(txt) => handleCopyText(txt, '공유 텍스트가 복사되었습니다!')}
                    />

                    <M.TripListModal
                        isOpen={isTripListModalOpen}
                        currentTrip={currentTrip}
                        allVisibleTrips={allVisibleTrips}
                        visiblePrivateTrips={visiblePrivateTrips}
                        visibleSharedTrips={visibleSharedTrips}
                        isAdmin={isAdmin}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsTripListModalOpen(false)}
                        onSelectTrip={handleSelectTrip}
                        onDeleteTrip={handleDeleteTrip}
                        onOpenJoinCode={() => setIsJoinCodeModalOpen(true)}
                        onOpenNewTrip={() => setIsNewTripModalOpen(true)}
                    />

                    <M.JoinCodeModal
                        isOpen={isJoinCodeModalOpen}
                        digits={joinCodeDigits}
                        setDigits={setJoinCodeDigits}
                        onClose={() => setIsJoinCodeModalOpen(false)}
                        onSubmit={handleJoinByCode}
                    />
                </div>
            );
        }

        // 외부 modals.jsx 트랜스파일 완료 보장 후 안전하게 렌더링
        function mountApp(retries = 0) {
            if (window.TripfullModals || retries >= 30) {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(
                    <ErrorBoundary>
                        <App />
                    </ErrorBoundary>
                );
            } else {
                setTimeout(() => mountApp(retries + 1), 100);
            }
        }
        mountApp();
    </script>
</body>
</html>
