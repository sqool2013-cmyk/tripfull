<body class="bg-[#F4F7F9] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200 selection:bg-teal-500 selection:text-white">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center p-6 text-center">
            <div class="space-y-2">
                <div class="text-2xl animate-pulse">✈️</div>
                <div class="text-sm font-extrabold text-slate-600">Tripfull 불러오는 중...</div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        const APP_VERSION = 'v.0.2.2';
        const U = window.TripfullUtils;
        const B = window.TripfullBudget;
        const API = window.TripfullAPI;

        // 배열/객체 안전 변환 헬퍼
        function toArray(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            if (typeof raw === 'object') return Object.values(raw).filter(Boolean);
            return [];
        }

        // 치명적 런타임 오류 발생 시 안내 화면을 보여주는 ErrorBoundary
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMsg: (error && error.message) || '알 수 없는 화면 오류' };
            }
            componentDidCatch(error, info) {
                console.error('[Tripfull ErrorBoundary]', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 text-slate-800">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 border border-slate-200 shadow-lg text-center space-y-3">
                                <div className="text-3xl">⚠️</div>
                                <h2 className="text-base font-extrabold">화면을 표시하는 중 문제가 발생했습니다</h2>
                                <p className="text-xs text-slate-500 break-all">{this.state.errorMsg}</p>
                                <button
                                    type="button"
                                    onClick={() => window.location.reload()}
                                    className="px-5 py-2.5 rounded-xl bg-[#00C48C] text-white text-xs font-extrabold"
                                >
                                    다시 불러오기
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const M = window.TripfullModals;

            // ----------------------------------------------------------------
            // 상태 선언
            // ----------------------------------------------------------------
            const [presetsVersion, setPresetsVersion] = useState(0);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    const cachedUser = API.getCachedUser();
                    if (cachedUser && cachedUser.theme) return cachedUser.theme === 'dark';
                    return localStorage.getItem('tripfull_theme') === 'dark';
                } catch (e) {
                    return false;
                }
            });

            // Firebase 동기화 상태
            const [isSyncOn, setIsSyncOn] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isProfilesLoaded, setIsProfilesLoaded] = useState(false);
            const [isTripsLoaded, setIsTripsLoaded] = useState(false);

            // 핵심 데이터 상태
            const [registeredProfiles, setRegisteredProfiles] = useState(() => API.getCachedProfiles() || {});
            const [allTripsMap, setAllTripsMap] = useState({});
            const [currentProfile, setCurrentProfile] = useState(() => API.getCachedUser());
            const [currentTripId, setCurrentTripId] = useState('');

            // 메인 화면 네비게이션 및 시계
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDay, setSelectedDay] = useState(1);
            const [expenseDayFilter, setExpenseDayFilter] = useState('all');
            const [nowTick, setNowTick] = useState(() => Date.now());

            // 알림 및 공용 모달 상태
            const [toastMessage, setToastMessage] = useState(null);
            const toastTimerRef = useRef(null);
            const [confirmDialog, setConfirmDialog] = useState({
                isOpen: false, title: '', message: '', confirmText: '확인', cancelText: '취소', danger: true, onConfirm: null
            });
            const [securityCheck, setSecurityCheck] = useState({
                isOpen: false, title: '', message: '', pin: '', isVerifying: false, onVerified: null
            });

            // 인증 / 계정 모달
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(() => !API.getCachedUser());
            const [loginForm, setLoginForm] = useState({ name: '', pin: '', avatar: '✈️' });
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
            const [editProfileForm, setEditProfileForm] = useState({ name: '', avatar: '✈️', pin: '' });
            const [isUserManageOpen, setIsUserManageOpen] = useState(false);

            // 여행 / 일정 / 가계부 / 체크리스트 모달
            const [isTripListModalOpen, setIsTripListModalOpen] = useState(false);
            const [isNewTripModalOpen, setIsNewTripModalOpen] = useState(false);
            const [isEditTripOpen, setIsEditTripOpen] = useState(false);
            const [isPlaceModalOpen, setIsPlaceModalOpen] = useState(false);
            const [isFlightHotelModalOpen, setIsFlightHotelModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [isSavingExpense, setIsSavingExpense] = useState(false);
            const [isRateModalOpen, setIsRateModalOpen] = useState(false);
            const [isQuickCalcModalOpen, setIsQuickCalcModalOpen] = useState(false);
            const [isShareModalOpen, setIsShareModalOpen] = useState(false);
            const [isJoinCodeModalOpen, setIsJoinCodeModalOpen] = useState(false);
            const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
            const [isSettlementModalOpen, setIsSettlementModalOpen] = useState(false);
            const [receiptViewer, setReceiptViewer] = useState({
                isOpen: false, tripId: '', expenseId: '', title: '', amountText: '', hasReceipt: false, receiptUrl: ''
            });

            // 폼 상태
            const [joinCodeDigits, setJoinCodeDigits] = useState('');
            const [newCheckText, setNewCheckText] = useState('');
            const [editingCheckItem, setEditingCheckItem] = useState(null);
            const [editingPlaceInfo, setEditingPlaceInfo] = useState(null);
            const [editingExpenseId, setEditingExpenseId] = useState(null);

            const [newTripForm, setNewTripForm] = useState(() => {
                const today = U.getTodayIso();
                return {
                    visibility: 'shared',
                    title: '',
                    country: '일본',
                    city: '도쿄',
                    customDestination: '',
                    startDate: today,
                    endDate: today,
                    currency: 'JPY',
                    budgetKRW: 1500000,
                    inviteKeys: []
                };
            });

            const [editTripForm, setEditTripForm] = useState({
                visibility: 'shared',
                title: '',
                country: '대한민국',
                destination: '',
                startDate: '',
                endDate: '',
                currency: 'KRW',
                budgetKRW: 1000000
            });

            const [newPlace, setNewPlace] = useState({
                day: 1, time: '', endTime: '', place: '', address: '',
                category: 'sightseeing', memo: '', cost: '', currency: 'KRW', linkUrl: ''
            });
            const [isSearchingAddress, setIsSearchingAddress] = useState(false);
            const [addressSearchResults, setAddressSearchResults] = useState([]);

            const [newExpense, setNewExpense] = useState({
                day: 1, title: '', amount: '', currency: 'KRW',
                payerId: 'c1', splitWith: ['c1'], category: 'food', method: 'card',
                linkedPlaceId: '', linkedPlaceName: '', receiptUrl: '',
                hasReceipt: false, pendingReceipt: null, removeReceipt: false
            });

            // 현재 프리셋 참조
            const P = useMemo(() => U.getPresets(), [presetsVersion]);
            const CATEGORY_META = P.categoryMeta || {};
            const CURRENCIES = P.currencies || {};
            const COUNTRY_PRESETS = P.countryPresets || {};

            // 토스트 알림 헬퍼
            const showToast = useCallback((msg) => {
                setToastMessage(msg);
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToastMessage(null), 3200);
            }, []);

            const askConfirm = useCallback((opts) => {
                setConfirmDialog({
                    isOpen: true,
                    title: opts.title || '확인',
                    message: opts.message || '',
                    confirmText: opts.confirmText || '확인',
                    cancelText: opts.cancelText || '취소',
                    danger: opts.danger !== undefined ? opts.danger : true,
                    onConfirm: opts.onConfirm || null
                });
            }, []);

            // ================================================================
            // 1. 초기화: presets.json 로드, 다크모드, 시계, Firebase 실시간 구독
            // ================================================================
            useEffect(() => {
                U.loadPresets('./presets.json?v=0.2.2').then(() => {
                    setPresetsVersion(v => v + 1);
                });
            }, []);

            useEffect(() => {
                const htmlEl = document.documentElement;
                if (isDarkMode) htmlEl.classList.add('dark');
                else htmlEl.classList.remove('dark');
                try {
                    localStorage.setItem('tripfull_theme', isDarkMode ? 'dark' : 'light');
                } catch (e) {}
            }, [isDarkMode]);

            useEffect(() => {
                const timer = setInterval(() => setNowTick(Date.now()), 30000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                try {
                    API.init();
                } catch (e) {
                    console.error('[Tripfull] Firebase 초기화 오류:', e);
                    return;
                }

                const unsubProfiles = API.subscribeProfiles(
                    (profilesMap) => {
                        setRegisteredProfiles(profilesMap || {});
                        setIsProfilesLoaded(true);
                        setIsSyncOn(true);
                    },
                    () => {
                        setIsProfilesLoaded(true);
                        setIsSyncOn(false);
                    }
                );

                const unsubTrips = API.subscribeTrips(
                    (tripsMap) => {
                        setAllTripsMap(tripsMap || {});
                        setIsTripsLoaded(true);
                        setIsSyncOn(true);
                    },
                    () => {
                        setIsTripsLoaded(true);
                        setIsSyncOn(false);
                    }
                );

                return () => {
                    if (typeof unsubProfiles === 'function') unsubProfiles();
                    if (typeof unsubTrips === 'function') unsubTrips();
                };
            }, []);

            // 원격 프로필 변경 사항과 현재 로그인 세션 동기화 (비밀번호 변경 시 자동 로그아웃)
            useEffect(() => {
                if (!isProfilesLoaded || !currentProfile) return;
                const myKey = U.sanitizeKey(currentProfile.key || currentProfile.name);
                const remoteProf = registeredProfiles[myKey];

                if (!remoteProf) {
                    API.clearCachedUser();
                    setCurrentProfile(null);
                    setIsLoginModalOpen(true);
                    showToast('⚠️ 계정이 삭제되어 로그아웃되었습니다.');
                    return;
                }

                if (
                    remoteProf.authVersion &&
                    currentProfile.authVersion &&
                    Number(remoteProf.authVersion) > Number(currentProfile.authVersion)
                ) {
                    API.clearCachedUser();
                    setCurrentProfile(null);
                    setIsLoginModalOpen(true);
                    showToast('🔒 비밀번호가 변경되어 다시 로그인해주세요.');
                    return;
                }

                const merged = {
                    ...currentProfile,
                    ...remoteProf,
                    key: myKey,
                    authVersion: remoteProf.authVersion || currentProfile.authVersion
                };
                delete merged.pin;
                delete merged.pinHash;

                const changed =
                    merged.name !== currentProfile.name ||
                    merged.avatar !== currentProfile.avatar ||
                    Boolean(merged.isAdmin) !== Boolean(currentProfile.isAdmin) ||
                    JSON.stringify(toArray(merged.joinedTripIds)) !== JSON.stringify(toArray(currentProfile.joinedTripIds));

                if (changed) {
                    setCurrentProfile(merged);
                    API.saveCachedUser(merged);
                }
            }, [isProfilesLoaded, registeredProfiles]);

            // ================================================================
            // 2. 파생 데이터 계산 (보이는 여행 목록, 현재 여행, 정산/연동 집계)
            // ================================================================
            const activeUserKey = useMemo(() => {
                return currentProfile ? U.sanitizeKey(currentProfile.key || currentProfile.name) : '';
            }, [currentProfile]);

            const isAdmin = Boolean(currentProfile && currentProfile.isAdmin);

            const { visiblePrivateTrips, visibleSharedTrips, allVisibleTrips } = useMemo(() => {
                if (!activeUserKey) {
                    return { visiblePrivateTrips: [], visibleSharedTrips: [], allVisibleTrips: [] };
                }
                const joinedIds = new Set(toArray(currentProfile && currentProfile.joinedTripIds));
                const priv = [];
                const shared = [];

                Object.values(allTripsMap || {}).forEach(t => {
                    if (!t || !t.id) return;
                    const ownerKey = U.sanitizeKey(t.ownerKey || '');
                    const isOwner = ownerKey === activeUserKey;
                    const isCompanion = toArray(t.companions).some(
                        c => U.sanitizeKey(c.userKey || c.name) === activeUserKey
                    );

                    if (t.visibility === 'private') {
                        if (isOwner || isAdmin) priv.push(t);
                    } else {
                        if (isOwner || isCompanion || joinedIds.has(t.id) || isAdmin) {
                            shared.push(t);
                        }
                    }
                });

                const sortByRecent = (a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
                priv.sort(sortByRecent);
                shared.sort(sortByRecent);

                return {
                    visiblePrivateTrips: priv,
                    visibleSharedTrips: shared,
                    allVisibleTrips: [...priv, ...shared]
                };
            }, [allTripsMap, activeUserKey, isAdmin, currentProfile]);

            const currentTrip = useMemo(() => {
                if (allVisibleTrips.length === 0) return null;
                return allVisibleTrips.find(t => t.id === currentTripId) || allVisibleTrips[0];
            }, [allVisibleTrips, currentTripId]);

            useEffect(() => {
                if (currentTrip && currentTrip.id !== currentTripId) {
                    setCurrentTripId(currentTrip.id);
                }
            }, [currentTrip, currentTripId]);

            const tripDays = useMemo(() => U.getTripDayNumbers(currentTrip), [currentTrip]);
            const companions = useMemo(() => toArray(currentTrip && currentTrip.companions), [currentTrip]);
            const itinerary = useMemo(() => (currentTrip && currentTrip.itinerary) || {}, [currentTrip]);
            const expenses = useMemo(() => toArray(currentTrip && currentTrip.expenses), [currentTrip]);
            const checklist = useMemo(() => toArray(currentTrip && currentTrip.checklist), [currentTrip]);

            useEffect(() => {
                if (tripDays.length > 0 && !tripDays.includes(Number(selectedDay))) {
                    setSelectedDay(tripDays[0]);
                }
            }, [tripDays, selectedDay]);

            const selectedDayList = useMemo(() => toArray(itinerary[selectedDay]), [itinerary, selectedDay]);

            const localTimeInfo = useMemo(() => U.getLocalTimeInfo(currentTrip, nowTick), [currentTrip, nowTick, presetsVersion]);
            const tripStatusBadge = useMemo(() => U.getTripStatusBadge ? U.getTripStatusBadge(currentTrip) : null, [currentTrip, nowTick]);
            const budgetSummary = useMemo(() => B.calculateBudgetSummary(currentTrip), [currentTrip, presetsVersion]);

            // 일정 장소 ID별 연동 지출 집계 (1:N 다중 지출 양방향 매핑)
            const linkedExpensesByPlaceId = useMemo(() => {
                const map = {};
                expenses.forEach(exp => {
                    if (!exp || !exp.linkedPlaceId) return;
                    if (!map[exp.linkedPlaceId]) {
                        map[exp.linkedPlaceId] = { count: 0, totalKRW: 0 };
                    }
                    map[exp.linkedPlaceId].count += 1;
                    map[exp.linkedPlaceId].totalKRW += B.toKRW(currentTrip, exp.amount, exp.currency, exp.day || 0);
                });
                return map;
            }, [expenses, currentTrip, presetsVersion]);

            const filteredExpenses = useMemo(() => {
                if (expenseDayFilter === 'all') return expenses;
                const targetDay = Number(expenseDayFilter);
                return expenses.filter(exp => Number(exp.day || 0) === targetDay);
            }, [expenses, expenseDayFilter]);

            const filteredExpenseTotalKRW = useMemo(() => {
                return B.getFilteredExpenseTotalKRW(currentTrip, filteredExpenses);
            }, [currentTrip, filteredExpenses, presetsVersion]);

            const isItemCheckedByCompanion = useCallback((item, compId) => {
                if (!item) return false;
                if (item.checkedBy && typeof item.checkedBy === 'object' && item.checkedBy[compId] !== undefined) {
                    return Boolean(item.checkedBy[compId]);
                }
                return Boolean(item.checked);
            }, []);

            const fullyCompletedCheckCount = useMemo(() => {
                if (companions.length === 0) return 0;
                return checklist.filter(item =>
                    companions.every(comp => isItemCheckedByCompanion(item, comp.id))
                ).length;
            }, [checklist, companions, isItemCheckedByCompanion]);

            const shareSummaryText = useMemo(() => {
                return U.generateCleanShareSummary(currentTrip, budgetSummary);
            }, [currentTrip, budgetSummary, presetsVersion]);

            // ================================================================
            // 3. 공통 Trip 클라우드 저장 헬퍼
            // ================================================================
            const updateCurrentTrip = useCallback((updater) => {
                if (!currentTrip) return;
                const nextTrip = typeof updater === 'function'
                    ? updater(currentTrip)
                    : { ...currentTrip, ...updater };
                if (!nextTrip || !nextTrip.id) return;

                const stamped = { ...nextTrip, updatedAt: Date.now() };
                setAllTripsMap(prev => ({ ...prev, [stamped.id]: stamped }));
                setIsSyncing(true);
                API.saveTrip(stamped)
                    .then(() => {
                        setIsSyncing(false);
                        setIsSyncOn(true);
                    })
                    .catch((err) => {
                        console.error('[Tripfull] 여행 저장 오류:', err);
                        setIsSyncing(false);
                        showToast('❌ 클라우드 저장 중 오류가 발생했습니다.');
                    });
            }, [currentTrip, showToast]);

            const handleToggleDarkMode = () => {
                const nextDark = !isDarkMode;
                setIsDarkMode(nextDark);
                if (currentProfile && activeUserKey) {
                    const updated = { ...currentProfile, theme: nextDark ? 'dark' : 'light' };
                    setCurrentProfile(updated);
                    API.saveCachedUser(updated);
                    API.saveProfile(activeUserKey, updated).catch(() => {});
                }
            };

            const handleCopyText = async (text, msg) => {
                const ok = await U.copyToClipboard(text);
                showToast(ok ? (msg || '📋 클립보드에 복사되었습니다!') : '❌ 복사에 실패했습니다.');
            };

            // ================================================================
            // 4. 인증 · 프로필 · 관리자 핸들러
            // ================================================================
            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                const cleanName = loginForm.name.trim();
                const cleanPin = loginForm.pin.trim();
                if (!cleanName) return showToast('⚠️ 아이디(이름)를 입력해주세요.');
                if (cleanPin.length < 4) return showToast('⚠️ 비밀번호는 4자리 이상 입력해주세요.');

                const key = U.sanitizeKey(cleanName);
                setIsLoggingIn(true);
                try {
                    const existing = registeredProfiles[key];
                    if (existing) {
                        const res = await API.verifyUserSecret(key, cleanPin, existing);
                        if (!res.ok) {
                            showToast('❌ 비밀번호가 일치하지 않습니다.');
                            setIsLoggingIn(false);
                            return;
                        }
                        const finalProf = {
                            ...(res.cleanedProfile || existing),
                            key,
                            authVersion: res.authVersion || existing.authVersion || Date.now(),
                            lastLoginAt: Date.now()
                        };
                        delete finalProf.pin;
                        delete finalProf.pinHash;

                        await API.saveProfile(key, finalProf);
                        setCurrentProfile(finalProf);
                        API.saveCachedUser(finalProf);
                        if (finalProf.theme) setIsDarkMode(finalProf.theme === 'dark');
                        setIsLoginModalOpen(false);
                        setLoginForm({ name: '', pin: '', avatar: '✈️' });
                        showToast(
                            res.migrated
                                ? `🔒 ${finalProf.avatar} ${finalProf.name}님 환영합니다! (보안 자동 업그레이드 완료)`
                                : `✈️ ${finalProf.avatar || '✈️'} ${finalProf.name}님 환영합니다!`
                        );
                    } else {
                        const isFirstUser = Object.keys(registeredProfiles || {}).length === 0;
                        const created = await API.registerNewProfile({
                            name: cleanName,
                            pin: cleanPin,
                            avatar: loginForm.avatar || '✈️',
                            isAdmin: isFirstUser,
                            theme: isDarkMode ? 'dark' : 'light'
                        });
                        setCurrentProfile(created);
                        API.saveCachedUser(created);
                        setIsLoginModalOpen(false);
                        setLoginForm({ name: '', pin: '', avatar: '✈️' });
                        showToast(
                            isFirstUser
                                ? `👑 첫 계정 '${created.name}'(관리자)로 시작합니다!`
                                : `🎉 새 계정 '${created.name}'으로 시작합니다!`
                        );
                    }
                } catch (err) {
                    console.error('[Tripfull] 로그인 처리 오류:', err);
                    showToast('❌ 로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                API.clearCachedUser();
                setCurrentProfile(null);
                setLoginForm({ name: '', pin: '', avatar: '✈️' });
                setIsLoginModalOpen(true);
                showToast('👋 로그아웃되었습니다.');
            };

            const openEditMyProfile = () => {
                if (!currentProfile) return;
                setEditProfileForm({
                    name: currentProfile.name || '',
                    avatar: currentProfile.avatar || '✈️',
                    pin: ''
                });
                setIsEditProfileOpen(true);
            };

            const handleSaveMyProfile = async (e) => {
                e.preventDefault();
                if (!currentProfile || !activeUserKey) return;
                const nextName = editProfileForm.name.trim();
                const nextPin = editProfileForm.pin.trim();
                if (!nextName) return;
                if (nextPin && nextPin.length < 4) {
                    return showToast('⚠️ 새 비밀번호는 4자리 이상 입력해주세요.');
                }

                try {
                    let nextProf = {
                        ...currentProfile,
                        key: activeUserKey,
                        name: nextName,
                        avatar: editProfileForm.avatar || '✈️'
                    };
                    if (nextPin) {
                        nextProf = await API.updateUserPassword(activeUserKey, nextPin, nextProf);
                    } else {
                        await API.saveProfile(activeUserKey, nextProf);
                    }
                    setCurrentProfile(nextProf);
                    API.saveCachedUser(nextProf);
                    setIsEditProfileOpen(false);
                    showToast(nextPin ? '🔒 프로필과 비밀번호가 변경되었습니다.' : '✅ 프로필이 수정되었습니다.');
                } catch (err) {
                    console.error('[Tripfull] 프로필 수정 오류:', err);
                    showToast('❌ 프로필 저장에 실패했습니다.');
                }
            };

            const handleSecurityCheckSubmit = async (e) => {
                e.preventDefault();
                if (!currentProfile || !activeUserKey) return;
                setSecurityCheck(prev => ({ ...prev, isVerifying: true }));
                try {
                    const res = await API.verifyUserSecret(activeUserKey, securityCheck.pin, registeredProfiles[activeUserKey] || currentProfile);
                    if (!res.ok) {
                        showToast('❌ 비밀번호가 일치하지 않습니다.');
                        setSecurityCheck(prev => ({ ...prev, isVerifying: false }));
                        return;
                    }
                    const cb = securityCheck.onVerified;
                    setSecurityCheck({ isOpen: false, title: '', message: '', pin: '', isVerifying: false, onVerified: null });
                    if (typeof cb === 'function') cb();
                } catch (err) {
                    showToast('❌ 보안 확인 중 오류가 발생했습니다.');
                    setSecurityCheck(prev => ({ ...prev, isVerifying: false }));
                }
            };

            // 관리자용 사용자 관리 핸들러
            const handleToggleAdmin = async (prof) => {
                const pKey = prof.key || U.sanitizeKey(prof.name);
                try {
                    await API.saveProfile(pKey, { ...prof, key: pKey, isAdmin: !prof.isAdmin });
                    showToast(`👑 '${prof.name}' 님의 관리자 권한이 변경되었습니다.`);
                } catch (err) {
                    showToast('❌ 권한 변경에 실패했습니다.');
                }
            };

            const handleResetUserPin = async (prof, newPin) => {
                const pKey = prof.key || U.sanitizeKey(prof.name);
                try {
                    await API.updateUserPassword(pKey, newPin, prof);
                    showToast(`🔑 '${prof.name}' 님의 비밀번호가 초기화되었습니다.`);
                } catch (err) {
                    showToast('❌ 비밀번호 초기화에 실패했습니다.');
                }
            };

            const handleDeleteUser = (prof) => {
                const pKey = prof.key || U.sanitizeKey(prof.name);
                askConfirm({
                    title: '계정 삭제 확인',
                    message: `[${prof.avatar || '✈️'} ${prof.name}] 계정을 영구 삭제하시겠습니까?`,
                    confirmText: '삭제',
                    onConfirm: async () => {
                        try {
                            await API.deleteProfile(pKey);
                            showToast(`🗑️ '${prof.name}' 계정이 삭제되었습니다.`);
                        } catch (err) {
                            showToast('❌ 계정 삭제에 실패했습니다.');
                        }
                    }
                });
            };

            // ================================================================
            // 5. 여행 생성 · 수정 · 삭제 · 전환 · 초대코드 · 동행자 핸들러
            // ================================================================
            const openNewTripModal = () => {
                const today = U.getTodayIso();
                setNewTripForm({
                    visibility: 'shared',
                    title: '',
                    country: '일본',
                    city: '도쿄',
                    customDestination: '',
                    startDate: today,
                    endDate: today,
                    currency: 'JPY',
                    budgetKRW: 1500000,
                    inviteKeys: []
                });
                setIsNewTripModalOpen(true);
            };

            const handleCreateNewTrip = async (e) => {
                e.preventDefault();
                if (!currentProfile || !newTripForm.title.trim()) return;

                const country = newTripForm.country || '직접 입력';
                const city = newTripForm.city || '';
                const destination = (country === '직접 입력' || city === '직접 입력')
                    ? (newTripForm.customDestination || '').trim() || '여행지'
                    : (country === city ? country : `${country} ${city}`);

                const startDate = newTripForm.startDate || U.getTodayIso();
                const endDate = (newTripForm.endDate && newTripForm.endDate >= startDate) ? newTripForm.endDate : startDate;
                const curr = newTripForm.currency || 'KRW';
                const currMeta = CURRENCIES[curr] || { defaultRate: 1 };

                const tripComps = [
                    {
                        id: 'c_' + activeUserKey,
                        userKey: activeUserKey,
                        name: currentProfile.name,
                        avatar: currentProfile.avatar || '✈️'
                    }
                ];

                if (newTripForm.visibility !== 'private' && Array.isArray(newTripForm.inviteKeys)) {
                    newTripForm.inviteKeys.forEach(k => {
                        const prof = registeredProfiles[k];
                        if (prof && k !== activeUserKey) {
                            tripComps.push({
                                id: 'c_' + k,
                                userKey: k,
                                name: prof.name,
                                avatar: prof.avatar || '✈️'
                            });
                        }
                    });
                }

                const dayList = U.getTripDayNumbers({ startDate, endDate });
                const initialItin = {};
                dayList.forEach(d => { initialItin[d] = []; });

                const presetItems = (COUNTRY_PRESETS[country] && COUNTRY_PRESETS[country].presets) || [];
                const initialChecklist = presetItems.map((txt, idx) => ({
                    id: `chk_${Date.now()}_${idx}`,
                    text: txt,
                    checkedBy: {}
                }));

                const newTrip = {
                    id: 'trip_' + Date.now(),
                    visibility: newTripForm.visibility === 'private' ? 'private' : 'shared',
                    shareCode: newTripForm.visibility === 'private' ? '' : U.generateUniqueShareCode(allTripsMap),
                    ownerKey: activeUserKey,
                    title: newTripForm.title.trim(),
                    country,
                    city,
                    destination,
                    startDate,
                    endDate,
                    currency: curr,
                    exchangeRate: currMeta.defaultRate || 1,
                    baseRates: { [curr]: currMeta.defaultRate || 1 },
                    dailyRates: {},
                    budgetKRW: Number(newTripForm.budgetKRW) || 1000000,
                    companions: tripComps,
                    itinerary: initialItin,
                    expenses: [],
                    settlements: [],
                    checklist: initialChecklist,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };

                try {
                    await API.saveTrip(newTrip);
                    setCurrentTripId(newTrip.id);
                    setSelectedDay(1);
                    setExpenseDayFilter('all');
                    setIsNewTripModalOpen(false);
                    showToast(`✈️ '${newTrip.title}' 여행이 생성되었습니다!`);
                } catch (err) {
                    console.error('[Tripfull] 새 여행 생성 오류:', err);
                    showToast('❌ 여행 생성 중 오류가 발생했습니다.');
                }
            };

            const openEditTripModal = () => {
                if (!currentTrip) return;
                setEditTripForm({
                    visibility: currentTrip.visibility || 'shared',
                    title: currentTrip.title || '',
                    country: currentTrip.country || '직접 입력',
                    destination: currentTrip.destination || '',
                    startDate: currentTrip.startDate || U.getTodayIso(),
                    endDate: currentTrip.endDate || currentTrip.startDate || U.getTodayIso(),
                    currency: currentTrip.currency || 'KRW',
                    budgetKRW: currentTrip.budgetKRW || 1000000
                });
                setIsEditTripOpen(true);
            };

            const handleSaveEditTrip = (e) => {
                e.preventDefault();
                if (!currentTrip || !editTripForm.title.trim()) return;
                const nextCurr = editTripForm.currency || currentTrip.currency || 'KRW';
                const nextBaseRates = { ...(currentTrip.baseRates || {}) };
                if (!nextBaseRates[nextCurr]) {
                    nextBaseRates[nextCurr] = (CURRENCIES[nextCurr] && CURRENCIES[nextCurr].defaultRate) || 1;
                }
                const nextShareCode = editTripForm.visibility === 'private'
                    ? (currentTrip.shareCode || '')
                    : (currentTrip.shareCode || U.generateUniqueShareCode(allTripsMap));

                updateCurrentTrip(t => ({
                    ...t,
                    visibility: editTripForm.visibility === 'private' ? 'private' : 'shared',
                    shareCode: nextShareCode,
                    title: editTripForm.title.trim(),
                    country: editTripForm.country || '직접 입력',
                    destination: editTripForm.destination.trim() || t.destination,
                    startDate: editTripForm.startDate,
                    endDate: editTripForm.endDate >= editTripForm.startDate ? editTripForm.endDate : editTripForm.startDate,
                    currency: nextCurr,
                    exchangeRate: nextBaseRates[nextCurr],
                    baseRates: nextBaseRates,
                    budgetKRW: Number(editTripForm.budgetKRW) || 0
                }));
                setIsEditTripOpen(false);
                showToast('✅ 여행 기본 설정이 저장되었습니다.');
            };

            const handleSelectTrip = (tripId) => {
                setCurrentTripId(tripId);
                setSelectedDay(1);
                setExpenseDayFilter('all');
                setIsTripListModalOpen(false);
            };

            const handleDeleteTrip = (tripObj, e) => {
                if (e) e.stopPropagation();
                const isOwner = U.sanitizeKey(tripObj.ownerKey) === activeUserKey;
                const canDelete = isOwner || isAdmin;

                if (canDelete) {
                    askConfirm({
                        title: '여행 삭제 확인',
                        message: `[${tripObj.title}] 여행과 모든 일정·가계부·영수증을 영구 삭제하시겠습니까?`,
                        confirmText: '영구 삭제',
                        onConfirm: async () => {
                            try {
                                await API.deleteTrip(tripObj.id);
                                showToast(`🗑️ '${tripObj.title}' 여행이 삭제되었습니다.`);
                            } catch (err) {
                                showToast('❌ 여행 삭제에 실패했습니다.');
                            }
                        }
                    });
                } else {
                    askConfirm({
                        title: '공유 여행 나가기',
                        message: `[${tripObj.title}] 공유 여행에서 나가시겠습니까?`,
                        confirmText: '나가기',
                        onConfirm: async () => {
                            try {
                                const nextComps = toArray(tripObj.companions).filter(
                                    c => U.sanitizeKey(c.userKey || c.name) !== activeUserKey
                                );
                                await API.saveTrip({ ...tripObj, companions: nextComps });
                                const nextJoined = toArray(currentProfile && currentProfile.joinedTripIds).filter(id => id !== tripObj.id);
                                const nextProf = { ...currentProfile, joinedTripIds: nextJoined };
                                await API.saveProfile(activeUserKey, nextProf);
                                setCurrentProfile(nextProf);
                                API.saveCachedUser(nextProf);
                                showToast(`👋 '${tripObj.title}' 여행에서 나갔습니다.`);
                            } catch (err) {
                                showToast('❌ 처리 중 오류가 발생했습니다.');
                            }
                        }
                    });
                }
            };

            const handleJoinByCode = async (e) => {
                e.preventDefault();
                if (!currentProfile || joinCodeDigits.length !== 4) {
                    return showToast('⚠️ 초대 코드 숫자 4자리를 정확히 입력해주세요.');
                }
                const targetCode = 'TRIP-' + joinCodeDigits;
                const matched = Object.values(allTripsMap || {}).find(
                    t => t && t.visibility !== 'private' && String(t.shareCode || '').toUpperCase() === targetCode
                );
                if (!matched) {
                    return showToast(`❌ 초대 코드(${targetCode})에 해당하는 공유 여행을 찾을 수 없습니다.`);
                }

                try {
                    const existingComps = toArray(matched.companions);
                    const alreadyIn = existingComps.some(
                        c => U.sanitizeKey(c.userKey || c.name) === activeUserKey
                    );
                    if (!alreadyIn) {
                        const nextComps = [
                            ...existingComps,
                            {
                                id: 'c_' + activeUserKey + '_' + Date.now(),
                                userKey: activeUserKey,
                                name: currentProfile.name,
                                avatar: currentProfile.avatar || '✈️'
                            }
                        ];
                        await API.saveTrip({ ...matched, companions: nextComps });
                    }

                    const prevJoined = toArray(currentProfile.joinedTripIds);
                    if (!prevJoined.includes(matched.id)) {
                        const nextProf = { ...currentProfile, joinedTripIds: [...prevJoined, matched.id] };
                        await API.saveProfile(activeUserKey, nextProf);
                        setCurrentProfile(nextProf);
                        API.saveCachedUser(nextProf);
                    }

                    setCurrentTripId(matched.id);
                    setSelectedDay(1);
                    setJoinCodeDigits('');
                    setIsJoinCodeModalOpen(false);
                    showToast(`🎉 '${matched.title}' 공유 여행에 참여했습니다!`);
                } catch (err) {
                    console.error('[Tripfull] 초대코드 참여 오류:', err);
                    showToast('❌ 여행 참여 처리에 실패했습니다.');
                }
            };

            const handleAddMember = ({ name, avatar, userKey }) => {
                if (!currentTrip || !name) return;
                const cleanKey = userKey || U.sanitizeKey(name);
                const exists = companions.some(c => U.sanitizeKey(c.userKey || c.name) === cleanKey);
                if (exists) return showToast('⚠️ 이미 동행 목록에 있는 멤버입니다.');

                const newComp = {
                    id: 'c_' + Date.now(),
                    userKey: cleanKey,
                    name,
                    avatar: avatar || '🧳'
                };
                updateCurrentTrip(t => ({ ...t, companions: [...toArray(t.companions), newComp] }));
                showToast(`👥 '${name}' 님이 동행 멤버로 추가되었습니다.`);
            };

            const handleRemoveMember = (comp) => {
                askConfirm({
                    title: '멤버 제외 확인',
                    message: `[${comp.avatar || '✈️'} ${comp.name}] 님을 이 여행 멤버에서 제외하시겠습니까?`,
                    confirmText: '제외',
                    onConfirm: () => {
                        updateCurrentTrip(t => ({
                            ...t,
                            companions: toArray(t.companions).filter(c => c.id !== comp.id)
                        }));
                        showToast(`👋 '${comp.name}' 님이 제외되었습니다.`);
                    }
                });
            };

            // ================================================================
            // 6. 일정 · 주소 검색 · 항공/숙소 자동 배치 핸들러
            // ================================================================
            const handleAddDay = () => {
                if (!currentTrip) return;
                const nextDay = (tripDays.length > 0 ? Math.max(...tripDays) : 0) + 1;
                if (nextDay > 30) return showToast('최대 30일차까지 추가할 수 있습니다.');
                updateCurrentTrip(t => ({
                    ...t,
                    itinerary: { ...(t.itinerary || {}), [nextDay]: [] }
                }));
                setSelectedDay(nextDay);
                showToast(`📅 ${nextDay}일차 탭이 추가되었습니다.`);
            };

            const openAddPlaceModal = () => {
                setEditingPlaceInfo(null);
                setAddressSearchResults([]);
                setNewPlace({
                    day: selectedDay, time: '', endTime: '', place: '', address: '',
                    category: 'sightseeing', memo: '', cost: '', currency: currentTrip?.currency || 'KRW', linkUrl: ''
                });
                setIsPlaceModalOpen(true);
            };

            const openEditPlaceModal = (dayNum, item) => {
                setEditingPlaceInfo({ day: Number(dayNum), id: item.id });
                setAddressSearchResults([]);
                setNewPlace({
                    day: Number(dayNum),
                    time: item.time || '',
                    endTime: item.endTime || '',
                    place: item.place,
                    address: item.address || '',
                    category: item.category || 'sightseeing',
                    memo: item.memo || '',
                    cost: item.cost ? String(item.cost) : '',
                    currency: item.currency || currentTrip?.currency || 'KRW',
                    linkUrl: item.linkUrl || ''
                });
                setIsPlaceModalOpen(true);
            };

            const handleSearchAddress = async () => {
                const q = (newPlace.place || newPlace.address || '').trim();
                if (!q) return showToast('🔍 장소명을 먼저 입력해주세요.');
                setIsSearchingAddress(true);
                setAddressSearchResults([]);
                try {
                    const destHint = currentTrip && currentTrip.country !== '직접 입력'
                        ? (currentTrip.city || currentTrip.country || '')
                        : '';
                    const results = await U.searchAddressNominatim(q, destHint);
                    if (results.length > 0) {
                        setAddressSearchResults(results);
                        const firstClean = U.formatKoreanAddress(results[0].display_name, newPlace.place);
                        setNewPlace(prev => ({ ...prev, address: firstClean }));
                    } else {
                        showToast('검색 결과가 없습니다. 주소를 직접 입력하실 수 있습니다.');
                    }
                } catch (err) {
                    showToast('❌ 주소 검색 서버 연결에 실패했습니다.');
                } finally {
                    setIsSearchingAddress(false);
                }
            };

            const handleSavePlace = (e) => {
                e.preventDefault();
                if (!newPlace.place.trim() || !currentTrip) return;
                if (newPlace.time && newPlace.endTime && newPlace.endTime < newPlace.time) {
                    return showToast('⚠️ 종료 시각이 방문 시각보다 빠릅니다.');
                }
                const targetDay = Number(newPlace.day) || selectedDay;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const itemData = {
                    id: editingPlaceInfo ? editingPlaceInfo.id : 'i_' + Date.now(),
                    time: newPlace.time,
                    endTime: newPlace.endTime || '',
                    place: newPlace.place.trim(),
                    address: newPlace.address.trim(),
                    category: newPlace.category,
                    memo: newPlace.memo.trim(),
                    cost: Number(newPlace.cost) || 0,
                    currency: newPlace.currency || currentTrip.currency,
                    linkUrl: U.normalizeExternalUrl ? U.normalizeExternalUrl(newPlace.linkUrl) : (newPlace.linkUrl || '').trim(),
                    updatedBy: authorTag
                };

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    if (editingPlaceInfo) {
                        const oldDay = editingPlaceInfo.day;
                        if (oldDay === targetDay) {
                            nextItin[targetDay] = toArray(nextItin[targetDay]).map(x =>
                                x.id === editingPlaceInfo.id ? itemData : x
                            );
                        } else {
                            nextItin[oldDay] = toArray(nextItin[oldDay]).filter(x => x.id !== editingPlaceInfo.id);
                            nextItin[targetDay] = [...toArray(nextItin[targetDay]), itemData];
                        }
                    } else {
                        nextItin[targetDay] = [...toArray(nextItin[targetDay]), itemData];
                    }
                    return { ...t, itinerary: nextItin };
                });

                setSelectedDay(targetDay);
                setIsPlaceModalOpen(false);
                showToast(editingPlaceInfo ? '✏️ 일정이 수정되었습니다.' : `📍 ${targetDay}일차에 '${itemData.place}' 일정이 추가되었습니다.`);
            };

            const handleDeletePlace = (dayNum, item, e) => {
                if (e) e.stopPropagation();
                askConfirm({
                    title: '일정 삭제 확인',
                    message: `[${dayNum}일차 · ${item.place}] 일정을 삭제하시겠습니까?`,
                    confirmText: '삭제',
                    onConfirm: () => {
                        updateCurrentTrip(t => ({
                            ...t,
                            itinerary: {
                                ...(t.itinerary || {}),
                                [dayNum]: toArray(t.itinerary && t.itinerary[dayNum]).filter(x => x.id !== item.id)
                            }
                        }));
                        showToast('🗑️ 일정이 삭제되었습니다.');
                    }
                });
            };

            const movePlaceOrder = (dayNum, index, direction, e) => {
                if (e) e.stopPropagation();
                if (!currentTrip) return;
                const list = [...toArray(currentTrip.itinerary && currentTrip.itinerary[dayNum])];
                if (list.length <= 1) return;
                let targetIndex = index;
                if (direction === 'top') targetIndex = 0;
                else if (direction === 'up') targetIndex = Math.max(0, index - 1);
                else if (direction === 'down') targetIndex = Math.min(list.length - 1, index + 1);
                else if (direction === 'bottom') targetIndex = list.length - 1;
                if (targetIndex === index) return;

                const [moved] = list.splice(index, 1);
                list.splice(targetIndex, 0, moved);
                updateCurrentTrip(t => ({ ...t, itinerary: { ...(t.itinerary || {}), [dayNum]: list } }));
            };

            const handleSortDayItinerary = (dayNum) => {
                if (!currentTrip) return;
                const list = toArray(currentTrip.itinerary && currentTrip.itinerary[dayNum]);
                if (list.length <= 1) return;
                const sorted = U.sortItineraryItems(list);
                updateCurrentTrip(t => ({ ...t, itinerary: { ...(t.itinerary || {}), [dayNum]: sorted } }));
                showToast(`⏰ ${dayNum}일차 일정을 시간순으로 정렬했습니다.`);
            };

            // 항공편(편도/왕복) 자동 일정 배치 (+ 선택 시 가계부 동시 등록)
            const handleSaveFlight = (flightForm) => {
                if (!currentTrip) return;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const nowId = Date.now();
                const outDay = Number(flightForm.outDay) || 1;
                const inDay = Number(flightForm.inDay) || outDay;
                const cleanUrl = U.normalizeExternalUrl ? U.normalizeExternalUrl(flightForm.linkUrl) : '';
                const rawCost = Number(flightForm.cost) || 0;
                const curr = flightForm.currency || 'KRW';

                const outPlaceText = flightForm.outTitle.trim();
                const outItem = {
                    id: 'i_flt_out_' + nowId,
                    time: flightForm.outTime || '',
                    endTime: flightForm.outEndTime || '',
                    place: outPlaceText.startsWith('🛫') || outPlaceText.startsWith('✈️') ? outPlaceText : `🛫 ${outPlaceText}`,
                    address: '',
                    category: 'transport',
                    memo: (flightForm.outMemo || '').trim(),
                    cost: rawCost,
                    currency: curr,
                    linkUrl: cleanUrl,
                    updatedBy: authorTag
                };

                let inItem = null;
                if (flightForm.tripType === 'round') {
                    const inPlaceText = flightForm.inTitle.trim();
                    inItem = {
                        id: 'i_flt_in_' + (nowId + 1),
                        time: flightForm.inTime || '',
                        endTime: flightForm.inEndTime || '',
                        place: inPlaceText.startsWith('🛬') || inPlaceText.startsWith('✈️') ? inPlaceText : `🛬 ${inPlaceText}`,
                        address: '',
                        category: 'transport',
                        memo: (flightForm.inMemo || '').trim(),
                        cost: 0,
                        currency: curr,
                        linkUrl: cleanUrl,
                        updatedBy: authorTag
                    };
                }

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    const outList = [...toArray(nextItin[outDay]), outItem];
                    nextItin[outDay] = outItem.time ? U.sortItineraryItems(outList) : outList;

                    if (inItem) {
                        const inList = [...toArray(nextItin[inDay]), inItem];
                        nextItin[inDay] = inItem.time ? U.sortItineraryItems(inList) : inList;
                    }

                    let nextExpenses = toArray(t.expenses);
                    if (rawCost > 0 && flightForm.addToBudget) {
                        const fltExp = {
                            id: 'e_flt_' + nowId,
                            day: 0,
                            title: flightForm.tripType === 'round' ? `항공권(왕복) · ${outPlaceText}` : `항공권 · ${outPlaceText}`,
                            amount: rawCost,
                            currency: curr,
                            payerId: flightForm.payerId || companions[0]?.id || 'c1',
                            splitWith: companions.map(c => c.id),
                            category: 'transport',
                            method: 'card',
                            linkedPlaceId: outItem.id,
                            linkedPlaceName: outItem.place,
                            updatedBy: authorTag
                        };
                        nextExpenses = [fltExp, ...nextExpenses];
                    }

                    return { ...t, itinerary: nextItin, expenses: nextExpenses };
                });

                setSelectedDay(outDay);
                showToast(
                    flightForm.tripType === 'round'
                        ? `✈️ 왕복 항공편이 ${outDay}일차·${inDay}일차에 자동 배치되었습니다!`
                        : `✈️ 편도 항공편이 ${outDay}일차에 자동 배치되었습니다!`
                );
            };

            // 숙소(전체/일부 기간) 자동 일정 배치 (+ 선택 시 가계부 동시 등록)
            const handleSaveHotel = (hotelForm) => {
                if (!currentTrip) return;
                const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                const nowId = Date.now();
                const inDay = Number(hotelForm.checkInDay) || 1;
                const outDay = Math.max(inDay, Number(hotelForm.checkOutDay) || inDay);
                const cleanName = hotelForm.name.trim();
                const cleanAddr = (hotelForm.address || '').trim();
                const cleanMemo = (hotelForm.memo || '').trim();
                const cleanUrl = U.normalizeExternalUrl ? U.normalizeExternalUrl(hotelForm.linkUrl) : '';
                const rawCost = Number(hotelForm.cost) || 0;
                const curr = hotelForm.currency || currentTrip.currency || 'KRW';

                const checkInItem = {
                    id: 'i_htl_in_' + nowId,
                    time: hotelForm.checkInTime || '15:00',
                    endTime: '',
                    place: `${cleanName} 체크인`,
                    address: cleanAddr,
                    category: 'hotel',
                    memo: cleanMemo,
                    cost: rawCost,
                    currency: curr,
                    linkUrl: cleanUrl,
                    updatedBy: authorTag
                };

                updateCurrentTrip(t => {
                    const nextItin = { ...(t.itinerary || {}) };
                    const inList = [...toArray(nextItin[inDay]), checkInItem];
                    nextItin[inDay] = checkInItem.time ? U.sortItineraryItems(inList) : inList;

                    if (outDay > inDay) {
                        if (hotelForm.includeMiddleNights) {
                            for (let d = inDay + 1; d < outDay; d++) {
                                const midItem = {
                                    id: `i_htl_mid_${nowId}_${d}`,
                                    time: '',
                                    endTime: '',
                                    place: `${cleanName} (연박)`,
                                    address: cleanAddr,
                                    category: 'hotel',
                                    memo: cleanMemo,
                                    cost: 0,
                                    currency: curr,
                                    linkUrl: cleanUrl,
                                    updatedBy: authorTag
                                };
                                nextItin[d] = [...toArray(nextItin[d]), midItem];
                            }
                        }

                        const checkOutItem = {
                            id: 'i_htl_out_' + (nowId + 99),
                            time: hotelForm.checkOutTime || '11:00',
                            endTime: '',
                            place: `${cleanName} 체크아웃`,
                            address: cleanAddr,
                            category: 'hotel',
                            memo: cleanMemo,
                            cost: 0,
                            currency: curr,
                            linkUrl: cleanUrl,
                            updatedBy: authorTag
                        };
                        const outList = [...toArray(nextItin[outDay]), checkOutItem];
                        nextItin[outDay] = checkOutItem.time ? U.sortItineraryItems(outList) : outList;
                    }

                    let nextExpenses = toArray(t.expenses);
                    if (rawCost > 0 && hotelForm.addToBudget) {
                        const htlExp = {
                            id: 'e_htl_' + nowId,
                            day: Number(hotelForm.budgetDay) || 0,
                            title: `${cleanName} 숙박비`,
                            amount: rawCost,
                            currency: curr,
                            payerId: hotelForm.payerId || companions[0]?.id || 'c1',
                            splitWith: companions.map(c => c.id),
                            category: 'hotel',
                            method: 'card',
                            linkedPlaceId: checkInItem.id,
                            linkedPlaceName: checkInItem.place,
                            updatedBy: authorTag
                        };
                        nextExpenses = [htlExp, ...nextExpenses];
                    }

                    return { ...t, itinerary: nextItin, expenses: nextExpenses };
                });

                setSelectedDay(inDay);
                showToast(`🏨 '${cleanName}' 숙소 일정(${inDay}일차~${outDay}일차)이 자동 배치되었습니다!`);
            };

            // ================================================================
            // 7. 가계부 지출 · 영수증 지연 로딩 · 다회차 중간 정산 핸들러
            // ================================================================
            const openAddExpenseModal = (defaultDay = null, preset = null) => {
                if (!currentTrip) return;
                setEditingExpenseId(null);
                const resolvedDay = defaultDay !== null
                    ? Number(defaultDay)
                    : (expenseDayFilter === 'all' ? selectedDay : Number(expenseDayFilter));
                const p = preset || {};
                setNewExpense({
                    day: resolvedDay,
                    title: p.title || '',
                    amount: p.amount !== undefined && p.amount !== null ? String(p.amount) : '',
                    currency: p.currency || currentTrip.currency,
                    payerId: companions[0]?.id || 'c1',
                    splitWith: companions.map(c => c.id),
                    category: p.category || 'food',
                    method: 'card',
                    linkedPlaceId: p.linkedPlaceId || '',
                    linkedPlaceName: p.linkedPlaceName || '',
                    receiptUrl: '',
                    hasReceipt: false,
                    pendingReceipt: null,
                    removeReceipt: false
                });
                setIsExpenseModalOpen(true);
            };

            const openEditExpenseModal = (exp) => {
                setEditingExpenseId(exp.id);
                setNewExpense({
                    day: exp.day !== undefined ? Number(exp.day) : 1,
                    title: exp.title,
                    amount: String(exp.amount),
                    currency: exp.currency,
                    payerId: exp.payerId,
                    splitWith: toArray(exp.splitWith),
                    category: exp.category || 'food',
                    method: exp.method || 'card',
                    linkedPlaceId: exp.linkedPlaceId || '',
                    linkedPlaceName: exp.linkedPlaceName || '',
                    receiptUrl: exp.receiptUrl || '',
                    hasReceipt: Boolean(exp.hasReceipt),
                    pendingReceipt: null,
                    removeReceipt: false
                });
                setIsExpenseModalOpen(true);
            };

            const openReceiptViewer = (expOrId) => {
                if (!currentTrip) return;
                const exp = typeof expOrId === 'string'
                    ? expenses.find(x => x.id === expOrId)
                    : expOrId;
                if (!exp) return;
                setReceiptViewer({
                    isOpen: true,
                    tripId: currentTrip.id,
                    expenseId: exp.id,
                    title: exp.title,
                    amountText: `${Number(exp.amount).toLocaleString()} ${exp.currency}`,
                    hasReceipt: Boolean(exp.hasReceipt),
                    receiptUrl: exp.receiptUrl || ''
                });
            };

            const handleSaveExpense = async (e) => {
                e.preventDefault();
                if (!newExpense.title.trim() || !newExpense.amount || !currentTrip) return;
                if (newExpense.splitWith.length === 0) return showToast('함께 정산할 인원을 최소 1명 이상 선택해주세요.');

                setIsSavingExpense(true);
                try {
                    const authorTag = currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : '익명';
                    const expId = editingExpenseId || ('e_' + Date.now());
                    let finalHasReceipt = Boolean(newExpense.hasReceipt);

                    if (newExpense.pendingReceipt && newExpense.pendingReceipt.dataUrl) {
                        await API.saveReceipt(currentTrip.id, expId, {
                            ...newExpense.pendingReceipt,
                            uploadedBy: authorTag
                        });
                        finalHasReceipt = true;
                    } else if (newExpense.removeReceipt) {
                        await API.deleteReceipt(currentTrip.id, expId);
                        finalHasReceipt = false;
                    }

                    const cleanReceiptUrl = U.normalizeExternalUrl
                        ? U.normalizeExternalUrl(newExpense.receiptUrl)
                        : (newExpense.receiptUrl || '').trim();

                    const itemData = {
                        id: expId,
                        day: Number(newExpense.day),
                        title: newExpense.title.trim(),
                        amount: Number(newExpense.amount),
                        currency: newExpense.currency,
                        payerId: newExpense.payerId,
                        splitWith: newExpense.splitWith,
                        category: newExpense.category,
                        method: newExpense.method,
                        linkedPlaceId: newExpense.linkedPlaceId || '',
                        linkedPlaceName: newExpense.linkedPlaceName || '',
                        receiptUrl: cleanReceiptUrl,
                        hasReceipt: finalHasReceipt,
                        updatedBy: authorTag
                    };

                    updateCurrentTrip(t => ({
                        ...t,
                        expenses: editingExpenseId
                            ? toArray(t.expenses).map(x => x.id === editingExpenseId ? itemData : x)
                            : [itemData, ...toArray(t.expenses)]
                    }));
                    setIsExpenseModalOpen(false);
                    showToast(editingExpenseId ? '✏️ 지출 내역이 수정되었습니다.' : '💰 가계부에 지출이 기록되었습니다.');
                } catch (err) {
                    console.error('[Tripfull] 지출/영수증 저장 실패:', err);
                    showToast('❌ 저장 중 오류가 발생했습니다. 네트워크를 확인해주세요.');
                } finally {
                    setIsSavingExpense(false);
                }
            };

            const handleDeleteExpense = (exp, e) => {
                if (e) e.stopPropagation();
                askConfirm({
                    title: '지출 내역 삭제 확인',
                    message: `[${exp.title} - ${Number(exp.amount).toLocaleString()} ${exp.currency}] 내역을 삭제하시겠습니까?`,
                    confirmText: '삭제',
                    onConfirm: () => {
                        if (exp.hasReceipt && currentTrip) {
                            API.deleteReceipt(currentTrip.id, exp.id);
                        }
                        updateCurrentTrip(t => ({ ...t, expenses: toArray(t.expenses).filter(x => x.id !== exp.id) }));
                        showToast('🗑️ 지출 내역이 삭제되었습니다.');
                    }
                });
            };

            const moveExpenseOrder = (expId, direction, e) => {
                if (e) e.stopPropagation();
                if (!currentTrip) return;
                const fullList = [...expenses];
                const idx = fullList.findIndex(x => x.id === expId);
                if (idx === -1) return;

                // 현재 필터 조건에 맞는 인접 항목과 위치 교환
                const step = direction === 'up' ? -1 : 1;
                let targetIdx = idx + step;
                if (expenseDayFilter !== 'all') {
                    const fDay = Number(expenseDayFilter);
                    while (targetIdx >= 0 && targetIdx < fullList.length && Number(fullList[targetIdx].day || 0) !== fDay) {
                        targetIdx += step;
                    }
                }
                if (targetIdx < 0 || targetIdx >= fullList.length) return;

                const temp = fullList[idx];
                fullList[idx] = fullList[targetIdx];
                fullList[targetIdx] = temp;
                updateCurrentTrip(t => ({ ...t, expenses: fullList }));
            };

            // 원클릭 오늘 전액 중간 정산
            const handleQuickSettle = (transfer) => {
                if (!transfer || !currentTrip) return;
                askConfirm({
                    title: '✅ 중간 정산 완료 기록',
                    message: `[${transfer.from} ➔ ${transfer.to} · ${Number(transfer.amount).toLocaleString()}원] 송금을 오늘 날짜로 정산 완료 처리하시겠습니까?\n(총 지출 금액은 유지되며 남은 정산액만 차감됩니다. 실수 시 언제든 롤백 가능합니다.)`,
                    confirmText: '정산 완료 기록',
                    danger: false,
                    onConfirm: () => {
                        const record = B.createSettlementRecord({
                            fromId: transfer.fromId,
                            toId: transfer.toId,
                            amountKRW: transfer.amount,
                            date: U.getTodayIso(),
                            memo: '중간 정산 완료',
                            createdBy: currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : ''
                        });
                        updateCurrentTrip(t => ({
                            ...t,
                            settlements: [record, ...B.normalizeSettlements(t.settlements)]
                        }));
                        showToast(`✅ ${transfer.from} ➔ ${transfer.to} ${Number(transfer.amount).toLocaleString()}원 정산이 기록되었습니다.`);
                    }
                });
            };

            // 날짜별 · 분할 금액 수동 중간 정산 기록 추가
            const handleAddManualSettlement = ({ fromId, toId, amountKRW, date, memo }) => {
                if (!fromId || !toId || fromId === toId) {
                    showToast('⚠️ 보낸 사람과 받은 사람은 서로 다른 멤버여야 합니다.');
                    return false;
                }
                if (!amountKRW || amountKRW <= 0) {
                    showToast('⚠️ 올바른 송금 금액을 입력해주세요.');
                    return false;
                }
                const record = B.createSettlementRecord({
                    fromId,
                    toId,
                    amountKRW,
                    date,
                    memo,
                    createdBy: currentProfile ? `${currentProfile.avatar} ${currentProfile.name}` : ''
                });
                updateCurrentTrip(t => ({
                    ...t,
                    settlements: [record, ...B.normalizeSettlements(t.settlements)]
                }));
                showToast(`✅ ${U.formatDateDot(record.date, false)} · ${Number(amountKRW).toLocaleString()}원 중간 정산이 기록되었습니다.`);
                return true;
            };

            // 중간 정산 기록 안전 롤백 (취소)
            const handleDeleteSettlement = (stl, fromComp, toComp) => {
                askConfirm({
                    title: '↩️ 중간 정산 롤백(취소)',
                    message: `[${U.formatDateDot(stl.date, true)} · ${fromComp.name} ➔ ${toComp.name} · ${Number(stl.amountKRW).toLocaleString()}원] 송금 기록을 롤백하시겠습니까?\n롤백 시 해당 금액이 다시 미정산 잔액으로 정확히 복구됩니다.`,
                    confirmText: '롤백 실행',
                    onConfirm: () => {
                        updateCurrentTrip(t => ({
                            ...t,
                            settlements: B.normalizeSettlements(t.settlements).filter(s => s.id !== stl.id)
                        }));
                        showToast('↩️ 중간 정산 기록이 롤백되어 미정산 잔액이 복구되었습니다.');
                    }
                });
            };

            // ================================================================

                const list = [...checklist];
                if (list.length <= 1) return;
                const targetIndex = direction === 'up'

                    : Math.min(list.length - 1, index + 1);
                if (targetIndex === index) return;
                const [moved] = list.splice(index, 1);
                list.splice(targetIndex, 0, moved);
                updateCurrentTrip(t => ({ ...t, checklist: list }));
