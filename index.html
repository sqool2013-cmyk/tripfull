                                                                            수정
                                                                        </button>
                                                                        <button
                                                                            type="button"
                                                                            onClick={(e) => handleDeleteExpense(exp, e)}
                                                                            className="text-xs font-bold text-rose-500 hover:bg-rose-50 px-2 py-1.5 rounded-lg"
                                                                        >
                                                                            삭제
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* ==================== 3. 준비물 체크리스트 탭 ==================== */}
                                {activeTab === 'checklist' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-5">
                                            <div className="flex flex-wrap items-center justify-between gap-2">
                                                <div>
                                                    <h3 className="text-lg font-extrabold text-slate-800">멤버별 준비물 체크리스트</h3>
                                                    <p className="text-xs text-slate-400">항목 이름을 터치하면 바로 수정할 수 있으며, 우측 ∧ ∨ 버튼으로 순서를 조정합니다.</p>
                                                </div>
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <button
                                                        type="button"
                                                        onClick={handleLoadCountryPresets}
                                                        className="text-xs font-extrabold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full"
                                                    >
                                                        ✨ 추천 항목 담기
                                                    </button>
                                                    <span className="text-xs font-extrabold text-[#00A878] bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
                                                        전원 완료 {fullyCompletedCheckCount} / {checklist.length}
                                                    </span>
                                                </div>
                                            </div>

                                            <form onSubmit={handleAddCheckItem} className="flex gap-2">
                                                <input
                                                    type="text"
                                                    placeholder="새 준비물 입력 (예: 보조배터리, 상비약, 우산)"
                                                    value={newCheckText}
                                                    onChange={(e) => setNewCheckText(e.target.value)}
                                                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold"
                                                />
                                                <button
                                                    type="submit"
                                                    className="bg-[#00C48C] hover:bg-[#00A878] text-white text-xs sm:text-sm font-extrabold px-5 py-2.5 rounded-xl shrink-0"
                                                >
                                                    + 추가
                                                </button>
                                            </form>

                                            {checklist.length === 0 ? (
                                                <div className="bg-slate-50 border border-dashed border-slate-200 rounded-2xl p-8 text-center text-xs text-slate-400">
                                                    아직 등록된 준비물이 없습니다. 위에서 항목을 추가하거나 [추천 항목 담기]를 눌러보세요!
                                                </div>
                                            ) : (
                                                <div className="border border-slate-200 rounded-2xl overflow-hidden bg-white">
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full border-collapse text-left min-w-max">
                                                            <thead>
                                                                <tr className="bg-slate-50 border-b border-slate-200">
                                                                    <th className="sticky left-0 z-10 bg-slate-50 py-3 px-3 sm:px-4 text-xs sm:text-sm font-extrabold text-slate-700 min-w-[125px] sm:min-w-[180px] border-r">준비물</th>
                                                                    {companions.map(comp => (
                                                                        <th key={comp.id} className="py-2.5 px-2 sm:px-3 text-center min-w-[68px] sm:min-w-[88px] border-r">
                                                                            <div className="text-xs sm:text-sm font-extrabold text-slate-800 whitespace-nowrap">{comp.avatar} {comp.name}</div>
                                                                        </th>
                                                                    ))}
                                                                    <th className="py-3 px-2 text-center text-xs font-bold text-slate-400 w-24">순서·삭제</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-200">
                                                                {checklist.map((item, idx) => (
                                                                    <tr key={item.id} className="hover:bg-slate-50/60">
                                                                        <td
                                                                            onClick={() => setEditingCheckItem({ id: item.id, text: item.text })}
                                                                            className="sticky left-0 z-10 py-3 px-3 sm:px-4 bg-white border-r cursor-pointer hover:text-[#00A878]"
                                                                            title="클릭하여 항목 이름 수정"
                                                                        >
                                                                            <span className="text-xs sm:text-sm font-extrabold text-slate-800 hover:underline">{item.text}</span>
                                                                        </td>
                                                                        {companions.map(comp => {
                                                                            const checked = isItemCheckedByCompanion(item, comp.id);
                                                                            return (
                                                                                <td
                                                                                    key={comp.id}
                                                                                    onClick={() => {
                                                                                        updateCurrentTrip(t => ({
                                                                                            ...t,
                                                                                            checklist: toArray(t.checklist).map(c => {
                                                                                                if (c.id !== item.id) return c;
                                                                                                const prevMap = (c.checkedBy && typeof c.checkedBy === 'object') ? { ...c.checkedBy } : {};
                                                                                                prevMap[comp.id] = !checked;
                                                                                                return { ...c, checkedBy: prevMap };
                                                                                            })
                                                                                        }));
                                                                                    }}
                                                                                    className="py-2.5 px-2 sm:px-3 text-center border-r cursor-pointer select-none"
                                                                                >
                                                                                    <button type="button" className={`w-7 h-7 mx-auto rounded-xl flex items-center justify-center text-xs font-black border transition ${checked ? 'bg-[#00C48C] border-[#00C48C] text-white' : 'bg-slate-50 border-slate-200 text-transparent'}`}>✓</button>
                                                                                </td>
                                                                            );
                                                                        })}
                                                                        <td className="py-2.5 px-2 text-center whitespace-nowrap">
                                                                            <div className="inline-flex items-center gap-1">
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => moveChecklistOrder(idx, 'up')}
                                                                                    disabled={idx === 0}
                                                                                    className="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-black text-slate-600 disabled:opacity-25"
                                                                                    title="위로 이동"
                                                                                >
                                                                                    ∧
                                                                                </button>
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => moveChecklistOrder(idx, 'down')}
                                                                                    disabled={idx === checklist.length - 1}
                                                                                    className="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-black text-slate-600 disabled:opacity-25"
                                                                                    title="아래로 이동"
                                                                                >
                                                                                    ∨
                                                                                </button>
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => {
                                                                                        askConfirm({
                                                                                            title: '준비물 삭제',
                                                                                            message: `[${item.text}] 항목을 삭제하시겠습니까?`,
                                                                                            confirmText: '삭제',
                                                                                            onConfirm: () => {
                                                                                                updateCurrentTrip(t => ({ ...t, checklist: toArray(t.checklist).filter(c => c.id !== item.id) }));
                                                                                            }
                                                                                        });
                                                                                    }}
                                                                                    className="w-6 h-6 rounded-lg text-xs font-black text-rose-500 hover:bg-rose-50"
                                                                                    title="항목 삭제"
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>
                        </>
                    )}

                    {/* ==================== 전체 모달 마운트 (modals.jsx) ==================== */}
                    <M.ConfirmDialogModal
                        dialog={confirmDialog}
                        onClose={() => setConfirmDialog(prev => ({ ...prev, isOpen: false }))}
                    />

                    <M.SecurityCheckModal
                        isOpen={securityCheck.isOpen}
                        title={securityCheck.title}
                        message={securityCheck.message}
                        pin={securityCheck.pin}
                        setPin={(val) => setSecurityCheck(prev => ({ ...prev, pin: val }))}
                        isVerifying={securityCheck.isVerifying}
                        onClose={() => setSecurityCheck({ isOpen: false, title: '', message: '', pin: '', isVerifying: false, onVerified: null })}
                        onSubmit={handleSecurityCheckSubmit}
                    />

                    <M.EditCheckItemModal
                        editingCheckItem={editingCheckItem}
                        setEditingCheckItem={setEditingCheckItem}
                        onClose={() => setEditingCheckItem(null)}
                        onSubmit={handleSaveEditCheckItem}
                    />

                    <M.LoginModal
                        isOpen={isLoginModalOpen}
                        currentProfile={currentProfile}
                        appVersion={APP_VERSION}
                        registeredProfiles={registeredProfiles}
                        isProfilesLoaded={isProfilesLoaded}
                        loginForm={loginForm}
                        setLoginForm={setLoginForm}
                        isSubmitting={isLoggingIn}
                        onClose={() => setIsLoginModalOpen(false)}
                        onSubmit={handleLoginSubmit}
                    />

                    <M.EditMyProfileModal
                        isOpen={isEditProfileOpen}
                        currentProfile={currentProfile}
                        form={editProfileForm}
                        setForm={setEditProfileForm}
                        onClose={() => setIsEditProfileOpen(false)}
                        onSubmit={handleSaveMyProfile}
                    />

                    <M.UserManageModal
                        isOpen={isUserManageOpen}
                        registeredProfiles={registeredProfiles}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsUserManageOpen(false)}
                        onToggleAdmin={handleToggleAdmin}
                        onResetPin={handleResetUserPin}
                        onDeleteUser={handleDeleteUser}
                    />

                    <M.MemberModal
                        isOpen={isMemberModalOpen}
                        currentTrip={currentTrip}
                        companions={companions}
                        registeredProfiles={registeredProfiles}
                        onClose={() => setIsMemberModalOpen(false)}
                        onAddMember={handleAddMember}
                        onRemoveMember={handleRemoveMember}
                    />

                    <M.PlaceModal
                        isOpen={isPlaceModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        editingPlaceInfo={editingPlaceInfo}
                        newPlace={newPlace}
                        setNewPlace={setNewPlace}
                        isSearchingAddress={isSearchingAddress}
                        addressSearchResults={addressSearchResults}
                        setAddressSearchResults={setAddressSearchResults}
                        onSearchAddress={handleSearchAddress}
                        onClose={() => setIsPlaceModalOpen(false)}
                        onSubmit={handleSavePlace}
                    />

                    <M.ExpenseModal
                        isOpen={isExpenseModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        companions={companions}
                        editingExpenseId={editingExpenseId}
                        newExpense={newExpense}
                        setNewExpense={setNewExpense}
                        isSavingExpense={isSavingExpense}
                        onPreviewExistingReceipt={(expId) => openReceiptViewer(expId)}
                        onClose={() => setIsExpenseModalOpen(false)}
                        onSubmit={handleSaveExpense}
                    />

                    <M.FlightHotelModal
                        isOpen={isFlightHotelModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        companions={companions}
                        onClose={() => setIsFlightHotelModalOpen(false)}
                        onSaveFlight={handleSaveFlight}
                        onSaveHotel={handleSaveHotel}
                    />

                    <M.ReceiptViewerModal
                        viewerState={receiptViewer}
                        onClose={() => setReceiptViewer(prev => ({ ...prev, isOpen: false }))}
                    />

                    <M.QuickCalcModal
                        isOpen={isQuickCalcModalOpen}
                        currentTrip={currentTrip}
                        selectedDay={selectedDay}
                        onClose={() => setIsQuickCalcModalOpen(false)}
                        onApplyToExpense={({ amount, currency }) => openAddExpenseModal(null, { amount, currency })}
                    />

                    <M.NewTripModal
                        isOpen={isNewTripModalOpen}
                        form={newTripForm}
                        setForm={setNewTripForm}
                        registeredProfiles={registeredProfiles}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsNewTripModalOpen(false)}
                        onSubmit={handleCreateNewTrip}
                    />

                    <M.EditTripModal
                        isOpen={isEditTripOpen}
                        currentTrip={currentTrip}
                        form={editTripForm}
                        setForm={setEditTripForm}
                        onClose={() => setIsEditTripOpen(false)}
                        onSubmit={handleSaveEditTrip}
                    />

                    <M.RateModal
                        isOpen={isRateModalOpen}
                        currentTrip={currentTrip}
                        tripDays={tripDays}
                        onClose={() => setIsRateModalOpen(false)}
                        onUpdateBaseRate={(code, val) => {
                            updateCurrentTrip(t => ({
                                ...t,
                                exchangeRate: code === t.currency ? val : t.exchangeRate,
                                baseRates: { ...(t.baseRates || {}), [code]: val }
                            }));
                        }}
                        onUpdateDailyRate={(dayNum, currency, rawVal) => {
                            updateCurrentTrip(t => {
                                const nextDaily = { ...(t.dailyRates || {}) };
                                const dayObj = { ...(nextDaily[dayNum] || {}) };
                                if (rawVal === '' || Number(rawVal) <= 0) delete dayObj[currency];
                                else dayObj[currency] = Number(rawVal);
                                nextDaily[dayNum] = dayObj;
                                return { ...t, dailyRates: nextDaily };
                            });
                        }}
                    />

                    <M.SettlementModal
                        isOpen={isSettlementModalOpen}
                        currentTrip={currentTrip}
                        companions={companions}
                        budgetSummary={budgetSummary}
                        onClose={() => setIsSettlementModalOpen(false)}
                        onQuickSettle={handleQuickSettle}
                        onAddManualSettlement={handleAddManualSettlement}
                        onDeleteSettlement={handleDeleteSettlement}
                    />

                    <M.ShareModal
                        isOpen={isShareModalOpen}
                        currentTrip={currentTrip}
                        shareText={shareSummaryText}
                        onClose={() => setIsShareModalOpen(false)}
                        onCopy={(txt) => handleCopyText(txt, '📋 공유 텍스트가 복사되었습니다!')}
                    />

                    <M.TripListModal
                        isOpen={isTripListModalOpen}
                        currentTrip={currentTrip}
                        allVisibleTrips={allVisibleTrips}
                        visiblePrivateTrips={visiblePrivateTrips}
                        visibleSharedTrips={visibleSharedTrips}
                        isAdmin={isAdmin}
                        activeUserKey={activeUserKey}
                        onClose={() => setIsTripListModalOpen(false)}
                        onSelectTrip={handleSelectTrip}
                        onDeleteTrip={handleDeleteTrip}
                        onOpenJoinCode={() => setIsJoinCodeModalOpen(true)}
                        onOpenNewTrip={openNewTripModal}
                    />

                    <M.JoinCodeModal
                        isOpen={isJoinCodeModalOpen}
                        digits={joinCodeDigits}
                        setDigits={setJoinCodeDigits}
                        onClose={() => setIsJoinCodeModalOpen(false)}
                        onSubmit={handleJoinByCode}
                    />
                </div>
            );
        }

        // 외부 modals.jsx 트랜스파일 완료 보장 후 안전하게 렌더링
        function mountApp(retries = 0) {
            if (window.TripfullModals && window.TripfullUtils && window.TripfullBudget && window.TripfullAPI) {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(
                    <ErrorBoundary>
                        <App />
                    </ErrorBoundary>
                );
            } else if (retries < 60) {
                setTimeout(() => mountApp(retries + 1), 100);
            } else {
                const rootEl = document.getElementById('root');
                if (rootEl) {
                    const missing = [
                        !window.TripfullUtils && 'utils.js',
                        !window.TripfullBudget && 'budget-engine.js',
                        !window.TripfullAPI && 'firebase-api.js',
                        !window.TripfullModals && 'modals.jsx'
                    ].filter(Boolean).join(', ');
                    rootEl.innerHTML =
                        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;">' +
                        '<div style="max-width:360px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">' +
                        '<div style="font-size:28px;margin-bottom:8px;">⚠️</div>' +
                        '<div style="font-size:15px;font-weight:800;color:#1e293b;margin-bottom:6px;">일부 모듈을 불러오지 못했습니다</div>' +
                        '<div style="font-size:12px;color:#64748b;margin-bottom:16px;">누락/오류 모듈: ' + (missing || '알 수 없음') + '</div>' +
                        '<button onclick="location.reload()" style="background:#00C48C;color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:12px;font-weight:800;cursor:pointer;">다시 불러오기</button>' +
                        '</div></div>';
                }
            }
        }
        mountApp();
    </script>
</body>
</html>
